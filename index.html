    /* v0.49 beta · icono de la aplicación: busca el logo junto a este archivo (en GitHub Pages, en la misma carpeta que index.html). Prueba estos nombres en orden; agrega el tuyo al inicio de la lista si es otro. */
    (function() {
        var N = ['favicon.png', '.favicon.png', 'Favicon.png', 'favicon.PNG', 'logo.png', 'icon.png', 'icono.png', 'icon-192.png', 'apple-touch-icon.png', 'favicon-32x32.png', 'favicon.jpg', 'favicon.ico'],
            b = location.href.split('#')[0].split('?')[0].replace(/[^\/]*$/, '');
        function set(u) {
            try {
                document.querySelectorAll('link[rel=icon],link[rel=apple-touch-icon],link[rel=manifest]').forEach(function(e) {
                    e.remove()
                });
                ['icon', 'apple-touch-icon'].forEach(function(r) {
                    var l = document.createElement('link');
                    l.rel = r;
                    l.href = u;
                    document.head.appendChild(l)
                });
                var m = {
                        name: 'Línea de trabajo · Lubricentro',
                        short_name: 'Lubricentro',
                        start_url: b,
                        scope: b,
                        display: 'standalone',
                        background_color: '#ffffff',
                        theme_color: '#111111',
                        icons: [{
                            src: u,
                            sizes: '192x192',
                            type: 'image/png',
                            purpose: 'any'
                        }, {
                            src: u,
                            sizes: '512x512',
                            type: 'image/png',
                            purpose: 'any'
                        }]
                    },
                    k = document.createElement('link');
                k.rel = 'manifest';
                k.href = URL.createObjectURL(new Blob([JSON.stringify(m)], {
                    type: 'application/manifest+json'
                }));
                document.head.appendChild(k);
                window.ICONO_URL = u
            } catch (e) {}
        }
        (function t(i) {
            if (location.protocol == 'file:' || i >= N.length)
                return;
            var u = b + N[i].replace(/^\./, function(x) {
                    return '.'
                }) + '?v=1',
                im = new Image();
            im.onload = function() {
                set(u)
            };
            im.onerror = function() {
                t(i + 1)
            };
            im.src = u
        })(0)
    })();

            }

                opacity:.15

    .dot::before {

    .rdy {

    @media (prefers-reduced-motion: no-preference) {
        /* puntos: doble aro tipo radar en proceso y pausa; aro más rápido si el filtro está activo */

        }

        @keyframes luzok {
            0%, 100% {
                opacity: 1;
                transform:scale(1)
            }

            50% {
                opacity: .45;
                transform: scale(.75)
            }
        }

        @keyframes luzven {
            0%, 49% {
                opacity:1
            }

            50%, 100% {
                opacity: .15
            }
        }

        @keyframes luzat {
            0%, 49% {
                opacity: 1;
                transform:scale(1.2)
            }

            50%, 100% {
                opacity: .1;
                transform: scale(.8)
            }
        }

        @keyframes brillo {
            0%, 65% {
                opacity: 0;
                transform:translateX(0) skewX(-20deg)
            }

            70% {
                opacity:1
            }

            100% {
                opacity: 0;
                transform: translateX(430%) skewX(-20deg)
            }

        }

        @keyframes ancho {
            0%, 100% {

                padding-inline: calc(var(--pd) + var(--amp));

            }
        }

        .tg.vencer {

        }

        .tg.atraso {

        }

        .tg.vencer::before {
            animation: luzven 1s steps(1) infinite
        }

        .tg.atraso::before {

        }

        .tg.ok::after {

        }

        .tg.vencer::after {
            animation: brillo 2.8s ease-in-out infinite
        }

        }/* Íconos de avisos: crecen y vuelven a su tamaño (sin giros). Crear = suave, eliminar = brusco, otros = intermedio */

        @keyframes popAdd {
            0% {

                opacity:0
            }

            60% {
                transform: scale(1.14);
                opacity:1
            }

            100% {
                transform: scale(1)
            }
        }

            0% {
                transform: scale(.35);
                opacity:0
            }

            30% {
                transform: scale(1.4);
                opacity:1
            }

            55% {
                transform:scale(.9)
            }

            75% {
                transform:scale(1.08)
            }

            100% {
                transform: scale(1)
            }
        }

        @keyframes popMid {
            0% {
                transform: scale(.55);
                opacity:0
            }

            55% {
                transform: scale(1.2);
                opacity:1
            }

            100% {
                transform: scale(1)
            }
        }

            animation: popAdd .6s .05s cubic-bezier(.25, .8, .35, 1) both
        }

        .bd.in .big.t-del {

    const TRF = (() => {

        return `<div class="zf" role="group" aria-label="Filtrar por zona"><span class="sm">Zona</span><button class="zc ${S.zf ? '' : 'sel'}" data-a="zf" data-z="">Todas</button>${ZA().map(z => `<button class="zc ${S.zf == z.id ? 'sel' : ''}" data-a="zf" data-z="${z.id}">${esc(z.nombre)}<small>${c(z.id)}</small></button>`).join('')}${S.view == 'comp' ? `<button class="zc ${S.zg ? 'sel' : ''}" data-a="zg" title="Agrupar por zona">${ic('workspaces')} Agrupar</button>` : ''}</div>`
    };
    /* v0.15 · FILTRO DE SUB-ZONAS (solo Órdenes completas): al elegir una zona aparece una 2ª fila con sus sub-zonas.
       Los nombres salen de Configuración (S.cfg.plataformas), así que si se renombra una sub-zona el filtro cambia solo. */
    const pfil = () => {
        if (S.view != 'comp')
            return '';

        if (!zid)
            return '';

        if (!ps.length)
            return '';
        const c = id => S.jobs.filter(j => j.estado == 'completado' && j.plataformaId == id).length;
        return `<div class="zf pf" role="group" aria-label="Filtrar por sub-zona"><span class="sm">Sub-zona</span><button class="zc ${S.pf ? '' : 'sel'}" data-a="pf" data-p="">Todas</button>${ps.map(p => `<button class="zc ${S.pf == p.id ? 'sel' : ''} ${p.activo ? '' : 'mut'}" data-a="pf" data-p="${p.id}">${esc(p.nombre)}<small>${c(p.id)}</small></button>`).join('')}</div>`
    };
    const zfil = () => MODO == 'mec' ? '' : zfil0() + pfil(); // fila de zonas + (si corresponde) fila de sub-zonas
    function subz() {
        const z = zn(S.modal.id),
            ps = S.cfg.plataformas.filter(p => p.zonaId == z.id);
        return `<div class="bd" data-a="cerrar"><div class="box"><b style="font-size:16px">Sub-zonas de ${esc(z.nombre)}</b><div class="sm">Plataformas o puestos de trabajo dentro de esta zona. Puedes cambiarles el nombre o moverlas a otra zona.</div>
         ${ps.map(p => `<div class="li"><input class="${p.activo ? '' : 'mut'}" data-ch="pnom" data-id="${p.id}" value="${esc(p.nombre)}" aria-label="Nombre"><select data-ch="pzona" data-id="${p.id}" aria-label="Zona">${zopts(p.zonaId)}</select><button data-a="cact" data-k="plataformas" data-id="${p.id}" title="Mostrar u ocultar">${ic(p.activo ? 'visibility' : 'visibility_off')}</button><button data-a="cdel" data-k="plataformas" data-id="${p.id}" title="Eliminar">${ic('delete')}</button></div>`).join('') || '<div class="mut" style="margin:8px 0">Esta zona aún no tiene sub-zonas.</div>'}
         <div class="add"><input id="n_pz" placeholder="Nueva sub-zona"><button data-a="padd" data-z="${z.id}" title="Agregar">${ic('add')}</button></div>
         <div class="btns" style="margin-top:12px"><button data-a="cerrar">Listo</button></div></div></div>`
    }
    function mapaedit() {
        const Z = S.cfg.zonas,

        S.zs = s.id;
        const st = (i, t, a, x) => `<button data-a="${a}" data-z="${s.id}" ${x} title="${t}" aria-label="${t}">${ic(i)}</button>`;

         <div class="zed"><input data-ch="znom" data-z="${s.id}" value="${esc(s.nombre)}" aria-label="Nombre de la zona">
         <div class="zpad"><span class="sm">Mover</span>${st('arrow_back', 'Izquierda', 'zmv', 'data-dx="-2" data-dy="0"')}${st('arrow_upward', 'Arriba', 'zmv', 'data-dx="0" data-dy="-2"')}${st('arrow_downward', 'Abajo', 'zmv', 'data-dx="0" data-dy="2"')}${st('arrow_forward', 'Derecha', 'zmv', 'data-dx="2" data-dy="0"')}</div>
         <div class="zpad"><span class="sm">Ancho</span>${st('remove', 'Más angosta', 'zrs', 'data-dw="-2"')}${st('add', 'Más ancha', 'zrs', 'data-dw="2"')}<span class="sm" style="margin-left:8px">Alto</span>${st('remove', 'Más baja', 'zrs', 'data-dh="-2"')}${st('add', 'Más alta', 'zrs', 'data-dh="2"')}</div>
         <div class="zpad"><span class="sm">Plazas</span>${st('remove', 'Menos plazas', 'zpl', 'data-d="-1"')}<b>${s.pl ?? 0}</b>${st('add', 'Más plazas', 'zpl', 'data-d="1"')}</div>
         <div class="zpad"><span class="sm" style="flex:1">${S.cfg.plataformas.filter(p => p.zonaId == s.id).length} sub-zonas</span>${st(s.activo === false ? 'visibility_off' : 'visibility', 'Mostrar u ocultar en el mapa', 'zact', '')}${st('delete', 'Eliminar zona', 'zdel', '')}</div></div>
         <div class="add"><input id="zn_new" placeholder="Nueva zona"><button data-a="zadd" title="Agregar zona">${ic('add')}</button></div><div class="btns" style="margin-top:12px"><button data-a="cerrar">Listo</button></div></div></div>`
    }
    function kpiRaw(zid) {
        // KPI del taller completo (una fila por zona) o de una zona (una fila por plataforma); con periodo, anillo de puntualidad y servicios más hechos
        const all = !zid,
            z = all ? null : zn(zid),
            ps = S.cfg.plataformas.filter(p => all || p.zonaId == z.id),
            ids = ps.map(p => p.id),
            P = S.kpp || 'todo',
            dias = {
                '7': 7,
                '30': 30
            },
            inP = j => P == 'todo' || (P == 'hoy' ? hoy(j.tiempos.completadoISO) : Date.parse(j.tiempos.completadoISO) >= Date.now() - dias[P] * 864e5),
            C = S.jobs.filter(j => j.estado == 'completado' && ids.includes(j.plataformaId) && inP(j)),
            act = S.jobs.filter(j => j.estado != 'completado' && ids.includes(j.plataformaId)),
            n = C.length,
            av = (L, f) => L.length ? Math.round(L.reduce((a, j) => a + f(j), 0) / L.length / 60) : 0,
            sg = v => (v > 0 ? '+' : '') + v + ' min',
            okF = L => L.filter(j => j.tiempos.desvSeg <= 0).length,
            pc = L => L.length ? Math.round(okF(L) / L.length * 100) : null,
            pct = pc(C),
            col = pct == null ? '#bbb' : pct >= 80 ? 'var(--completado)' : pct >= 60 ? 'var(--cola)' : 'var(--pausa)',
            R0 = 26,
            CI = 2 * Math.PI * R0,
            off = CI * (1 - (pct || 0) / 100),
            dv = n ? av(C, j => j.tiempos.desvSeg) : 0,
            late = act.filter(j => j.estado == 'proceso' && estado(j)[1] == 'atraso').length,
            tile = (i, v, l, t='') => `<div class="kp ${t}">${ic(i)}<b>${v}</b><small>${l}</small></div>`,
            rows = (all ? S.cfg.zonas.map(z => [z.nombre, C.filter(j => zof(j) == z.id)]) : ps.map(p => [p.nombre, C.filter(j => j.plataformaId == p.id)])).filter(r => r[1].length || all),
            sv = {};
        C.forEach(j => j.servicios.forEach(s => {
            if (s.hecho !== false)
                sv[s.nombre] = (sv[s.nombre] || 0) + 1
        }));
        const top = Object.entries(sv).sort((a, b) => b[1] - a[1]).slice(0, 3),
            mx = top.length ? top[0][1] : 1,
            per = [['hoy', 'Hoy'], ['7', '7 días'], ['30', '30 días'], ['todo', 'Todo']];
        const inT = iso => P == 'todo' || (P == 'hoy' ? hoy(iso) : Date.parse(iso) >= Date.now() - dias[P] * 864e5),
            JJ = S.jobs.filter(j => ids.includes(j.plataformaId)),
            evs = t => JJ.flatMap(j => (j.eventos || []).filter(e => e.tipo == t && inT(e.fechaISO))),
            ing = JJ.filter(j => inT(j.tiempos.ingresoISO)),
            pau = evs('pausado'),
            rea = evs('reabierto'),
            wl = C.map(j => {
                const e = (j.eventos || []).find(x => x.tipo == 'iniciado');
                return e ? (Date.parse(e.fechaISO) - Date.parse(j.tiempos.ingresoISO)) / 6e4 : null
            }).filter(x => x != null && x >= 0),
            wavg = wl.length ? Math.round(wl.reduce((a, b) => a + b, 0) / wl.length) : null,
            urg = ing.filter(j => j.prioridad == 'urgente').length,
            spanD = P == 'hoy' ? 1 : P == 'todo' ? Math.max(1, Math.ceil((Date.now() - Math.min(Date.now(), ...C.map(j => Date.parse(j.tiempos.completadoISO)))) / 864e5)) : dias[P],
            pm = {},
            mec = {};
        pau.forEach(e => {
            const b = e.detalle ? pmot(e.detalle) : 'Sin motivo';
            pm[b] = (pm[b] || 0) + 1
        });
        C.forEach(j => {
            const k = nm(S.cfg.mecanicos, j.mecanicoId),
                b = k == '—' ? 'Sin asignar' : k;
            (mec[b] = mec[b] || []).push(j)
        });
        const pmT = Object.entries(pm).sort((a, b) => b[1] - a[1]).slice(0, 5),
            pmx = pmT.length ? pmT[0][1] : 1,
            mecR = Object.entries(mec).sort((a, b) => b[1].length - a[1].length);
        return `<div class="bd" data-a="cerrar"><div class="box kpb"><div class="kph">${ic('query_stats')}<div><b style="font-size:18px">KPI · ${all ? 'Taller completo' : esc(z.nombre)}</b><div class="sm">Órdenes completadas${all ? ' en todo el taller' : ' en esta zona'}</div></div></div>
         <div class="chips kpf">${per.map(([k, t]) => `<button class="chip ${P == k ? 'sel' : ''}" data-a="kpp" data-p="${k}">${t}</button>`).join('')}</div>
         <div class="kpm"><svg viewBox="0 0 64 64" class="kpr" role="img" aria-label="Puntualidad"><circle cx="32" cy="32" r="${R0}" fill="none" stroke="#ececec" stroke-width="7"/><circle class="rg" cx="32" cy="32" r="${R0}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${CI.toFixed(1)}" style="stroke-dashoffset:${off.toFixed(1)}" transform="rotate(-90 32 32)"/><text x="32" y="32" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#111">${pct == null ? '—' : pct + '%'}</text></svg>
         <div class="kpt"><b>Puntualidad</b><span class="sm">${n ? `${okF(C)} de ${n} órdenes terminaron dentro del estimado` : 'Aún no hay órdenes completadas en este periodo'}</span>
         <div class="kpc"><span class="${act.some(j => j.estado == 'proceso') ? '' : 'z0'}"><i class="dot proceso"></i>${act.filter(j => j.estado == 'proceso').length}</span><span class="${act.some(j => j.estado == 'cola') ? '' : 'z0'}"><i class="dot cola"></i>${act.filter(j => stf(j, 'cola')).length}</span><span class="${act.some(j => stf(j, 'pausa')) ? '' : 'z0'}"><i class="dot pausa"></i>${act.filter(j => stf(j, 'pausa')).length}</span>${late ? `<span class="kpl">${late} atrasada${late > 1 ? 's' : ''}</span>` : ''}<span class="sm">ahora</span></div></div></div>
         <div class="kpg">${tile('task_alt', n, 'Completadas')}${tile('today', S.jobs.filter(j => j.estado == 'completado' && ids.includes(j.plataformaId) && hoy(j.tiempos.completadoISO)).length, 'Hoy')}${tile('timer', n ? av(C, j => j.tiempos.realSeg) + ' min' : '—', 'Real promedio')}${tile('schedule', n ? av(C, j => j.tiempos.estSeg) + ' min' : '—', 'Estimado prom.')}${tile(dv > 0 ? 'trending_up' : 'trending_down', n ? sg(dv) : '—', 'Desviación', !n ? '' : dv > 0 ? 'bad' : 'good')}${tile('percent', n && av(C, j => j.tiempos.estSeg) ? Math.round(av(C, j => j.tiempos.realSeg) / av(C, j => j.tiempos.estSeg) * 100) + '%' : '—', 'Real vs estimado')}${tile('login', ing.length, 'Ingresadas')}${tile('speed', n ? (n / spanD).toFixed(1).replace('.', ',') : '—', 'Completadas por día')}${tile('hourglass_top', wavg == null ? '—' : wavg + ' min', 'Espera en cola')}${tile('pause_circle', pau.length, 'Pausas')}${tile('replay', rea.length, 'Reaperturas', rea.length ? 'bad' : '')}${tile('priority_high', urg, 'Urgentes')}</div>
         ${rows.length ? `<div class="sec">${ic(all ? 'location_on' : 'garage')} ${all ? 'Por zona' : 'Por sub-zona'}</div>${rows.map(([nb, L]) => {const q = pc(L),d = L.length ? av(L, j => j.tiempos.desvSeg) : 0;return `<div class="kr"><div class="t"><span>${esc(nb)}</span><span class="mut">${L.length} compl.${L.length ? ` · <b class="${d > 0 ? 'kb' : 'kg'}">${sg(d)}</b>` : ''}</span></div><div class="bar2"><i style="width:${q == null ? 0 : q}%;background:${q == null ? '#ddd' : q >= 80 ? 'var(--completado)' : q >= 60 ? 'var(--cola)' : 'var(--pausa)'}"></i></div><div class="sm">${q == null ? 'Sin datos' : q + '% a tiempo'}</div></div>`}).join('')}` : ''}
         ${top.length ? `<div class="sec">${ic('build')} Servicios más hechos</div>${top.map(([nb, k]) => `<div class="kr"><div class="t"><span>${esc(nb)}</span><span class="mut">${k}</span></div><div class="bar2"><i style="width:${Math.round(k / mx * 100)}%;background:var(--ink)"></i></div></div>`).join('')}` : ''}
         ${mecR.length ? `<div class="sec">${ic('engineering')} Por mecánico</div>${mecR.map(([nb, L]) => {const q = pc(L),d = av(L, j => j.tiempos.desvSeg);return `<div class="kr"><div class="t"><span>${esc(nb)}</span><span class="mut">${L.length} compl. · <b class="${d > 0 ? 'kb' : 'kg'}">${sg(d)}</b></span></div><div class="bar2"><i style="width:${q}%;background:${q >= 80 ? 'var(--completado)' : q >= 60 ? 'var(--cola)' : 'var(--pausa)'}"></i></div><div class="sm">${q}% a tiempo · real prom. ${av(L, j => j.tiempos.realSeg)} min</div></div>`}).join('')}` : ''}
         ${pmT.length ? `<div class="sec">${ic('pause_circle')} Motivos de pausa</div>${pmT.map(([nb, k]) => `<div class="kr"><div class="t"><span>${esc(nb)}</span><span class="mut">${k}</span></div><div class="bar2"><i style="width:${Math.round(k / pmx * 100)}%;background:var(--pausa)"></i></div></div>`).join('')}` : ''}
         <div class="btns" style="margin-top:18px"><button data-a="cerrar">Cerrar</button></div></div></div>`
    }

    /* v0.19 · KPI de trabajos más solicitados: tipo (grupo) y servicio, cantidad de órdenes y recurrencia ("1 cada X"); más vehículos que vuelven */
    function kpiTop() {
        const P = S.tpp || '30',
            dias = {
                '7': 7,
                '30': 30
            },
            t0 = new Date().setHours(0, 0, 0, 0),
            inT = iso => P == 'todo' || (P == 'hoy' ? hoy(iso) : Date.parse(iso) >= Date.now() - dias[P] * 864e5),
            J = S.jobs.filter(j => inT(j.tiempos.ingresoISO)),
            span = P == 'hoy' ? Math.max(1 / 24, (Date.now() - t0) / 864e5) : P == 'todo' ? Math.max(1, (Date.now() - Math.min(Date.now(), ...S.jobs.map(j => Date.parse(j.tiempos.ingresoISO)))) / 864e5) : dias[P],
            ev = n => {
                const d = span / n;
                return d >= 1 ? '1 cada ' + (Math.round(d * 10) / 10).toString().replace('.', ',') + ' días' : '1 cada ' + Math.max(1, Math.round(d * 24)) + ' h'
            },
            by = f => {
                const m = {};
                J.forEach(j => new Set(j.servicios.map(f)).forEach(k => m[k] = (m[k] || 0) + 1));
                return Object.entries(m).sort((a, b) => b[1] - a[1])
            },
            row = ([nb, k], mx) => `<div class="kr"><div class="t"><span>${esc(nb)}</span><span class="mut"><b>${k}</b> ${k == 1 ? 'orden' : 'órdenes'} · ${Math.round(k / J.length * 100)}%</span></div><div class="bar2"><i style="width:${Math.round(k / mx * 100)}%;background:var(--ink)"></i></div><div class="sm">${ic('autorenew')} Recurrencia: ${ev(k)}</div></div>`,
            G = by(s => s.grupo || 'Otros'),
            V = by(s => s.nombre).slice(0, 8),
            veh = {};
        J.forEach(j => {
            const k = j.vehiculo.patenteN || j.vehiculo.patente;
            (veh[k] = veh[k] || []).push(j)
        });
        const VR = Object.values(veh).filter(L => L.length > 1).sort((a, b) => b.length - a.length).slice(0, 5);
        return `<div class="kpin"><div class="chips kpf">${[['hoy', 'Hoy'], ['7', '7 días'], ['30', '30 días'], ['todo', 'Todo']].map(([k, t]) => `<button class="chip ${P == k ? 'sel' : ''}" data-a="tpp" data-p="${k}">${t}</button>`).join('')}</div>
         ${J.length ? `<div class="sm">${J.length} ${J.length == 1 ? 'orden ingresada' : 'órdenes ingresadas'} en el periodo</div><div class="sec">${ic('category')} Por tipo de trabajo</div>${G.map(r => row(r, G[0][1])).join('')}<div class="sec">${ic('build')} Servicios más pedidos</div>${V.map(r => row(r, V[0][1])).join('')}${VR.length ? `<div class="sec">${ic('directions_car')} Vehículos recurrentes</div>${VR.map(L => `<div class="kr"><div class="t"><span>${plate(L[0].vehiculo.patente, 's')}</span><span class="mut"><b>${L.length}</b> visitas · última ${fdt(L.map(j => j.tiempos.ingresoISO).sort().pop())}</span></div></div>`).join('')}` : ''}` : '<div class="mut" style="margin-top:8px">Sin órdenes ingresadas en este periodo.</div>'}</div>`
    }

    const kpi = (zid, inl) => {
        const h = kpiRaw(zid);
        return inl ? h.replace('<div class="bd" data-a="cerrar"><div class="box kpb">', '<div class="kpb kpin">').replace('<div class="btns" style="margin-top:18px"><button data-a="cerrar">Cerrar</button></div></div></div>', '</div>') : h
    }; // inl = dentro del Dashboard
    const lstP = () => `${acc('plat', 'Zonas y sub-zonas', 'Sub-zonas de cada zona y mapa del taller', `<div class="note">Cada sub-zona (puesto de trabajo o plataforma) pertenece a una zona del mapa del taller. Si cambias su nombre, se actualiza en toda la app.</div><div style="margin:8px 0"><button class="wide" data-a="mapaed">${ic('map')} Modificar el mapa de taller</button></div>${S.cfg.plataformas.map(x => `<div class="li"><input class="${x.activo ? '' : 'mut'}" data-ch="pnom" data-id="${x.id}" value="${esc(x.nombre)}" aria-label="Nombre"><select data-ch="pzona" data-id="${x.id}" aria-label="Zona">${zopts(x.zonaId)}</select><button data-a="cact" data-k="plataformas" data-id="${x.id}" title="Activar/desactivar">${ic(x.activo ? 'visibility' : 'visibility_off')}</button><button data-a="cdel" data-k="plataformas" data-id="${x.id}" title="Eliminar">${ic('delete')}</button></div>`).join('')}<div class="add"><input id="n_plataformas" placeholder="Nueva sub-zona"><select id="z_plataformas" aria-label="Zona">${zopts()}</select><button data-a="cadd" data-k="plataformas" title="Agregar">${ic('add')}</button></div>`)}`;

    async function fbDiag() {

            u = 'https://firestore.googleapis.com/v1/projects/' + c.projectId + '/databases/(default)/documents/demo_config/principal?key=' + c.apiKey;
        try {
            const r = await fetch(u),
                j = await r.json().catch(() => ({})),
                er = j.error || {},
                st = er.status || '',
                m = er.message || '';
            if (r.ok || r.status == 404 && st == 'NOT_FOUND' && /document/i.test(m))
                return {
                    ok: 1,
                    t: 'La base responde y las reglas permiten leer. Si la app sigue sin conectar, el problema es la red del navegador (prueba otra red o Chrome).'
                };
            if (r.status == 404)
                return {
                    t: 'La base de datos Firestore NO existe en el proyecto ' + c.projectId + '.',
                    d: 'Consola de Firebase → Firestore Database → Crear base de datos (modo prueba). Luego recarga la app.'
                };
            if (r.status == 403 && /not been used|disabled/i.test(m))
                return {
                    t: 'La API de Firestore está desactivada o sin crear.',
                    d: 'Consola de Firebase → Firestore Database → Crear base de datos. ' + m
                };
            if (r.status == 403 && /referer|referrer|blocked/i.test(m))
                return {
                    t: 'La clave de API tiene restricciones de sitio web y bloquea este origen (' + location.origin + ').',
                    d: 'Google Cloud → Credenciales → tu clave → agrega ' + location.origin + '/* en referentes HTTP permitidos. ' + m
                };
            if (r.status == 403 || st == 'PERMISSION_DENIED')
                return {
                    t: 'Las reglas de Firestore no permiten leer/escribir.',
                    d: 'Firestore Database → Reglas → permitir lectura y escritura (modo de prueba) y publicar. ' + m
                };
            return {
                t: 'Firestore respondió ' + r.status + ' ' + st,
                d: m
            }
        }
        catch (e) {
            return {
                t: 'El navegador no puede llegar a Firestore (red, VPN, bloqueador o modo local sin internet).',
                d: String(e && e.message || e)
            }
        }

    function lsq(k, f) {
        LSQ[k] = f;

            lsT = setTimeout(lsFlush, 350)
    }
    function lsFlush() {
        clearTimeout(lsT);
        lsT = 0;
        for (const k in LSQ) {
            try {
                localStorage.setItem(k, LSQ[k]())
            } catch (e) {
                console.warn('localStorage', e)
            }
            delete LSQ[k]
        }
    }

       Estructura de cada registro: { id, tipo:'orden'|'banner_reingreso', motivo, fechaEliminacion (ISO), datos:{...} }
       · datos = resumen legible (patente, cliente, servicios, horas, estado, precio si existe, notas…) y, para órdenes, `orden` = copia completa (con su bitácora).

    const ELK = 'lubri_eliminados';

    function elLoad() {
        if (ELIM)

        try {

            ELIM = Array.isArray(a) ? a : []
        } catch (e) {
            ELIM = []
        }
        return ELIM
    }

        try {

        } catch (e) {

            return false
        }
    }
    /* FUTURO · VISTA DE ELIMINADOS: conectar aquí. Opciones: un bloque «Eliminados» en Configuración (acc('elim',…)) o una pantalla propia (S.view='elim' + V.elim) que lea getEliminados() y lo muestre con filtros por tipo y fecha. Aún no se construye. */

    function addEliminado(tipo, id, motivo, datos) {
        // guarda un registro; devuelve false si no se pudo guardar (en ese caso NO se debe eliminar nada)
        const L = elLoad(),
            rec = {
                id: String(id),
                tipo,
                motivo,
                fechaEliminacion: now(),
                datos
            };
        L.push(rec);
        for (let i = 0; i < L.length - 200; i++)
            if (L[i].datos && L[i].datos.orden)
                delete L[i].datos.orden;
        if (elSave())
            return true;
        for (const r of L)
            if (r !== rec && r.datos)
                delete r.datos.orden; // sin espacio: se descartan las copias completas antiguas y se reintenta
        if (elSave())
            return true;
        L.pop();
        return false
    }

    /* v9-10 · HISTORIAL DE CONSULTAS POR PATENTE: cada consulta con datos se registra en la base (colección consultas_patente, un documento por patente;
       demo_consultas_patente en modo demo). Se agrega una entrada solo si los datos cambiaron; si son iguales se actualiza la fecha de la última consulta y el contador.
       Solo se guardan datos del VEHÍCULO: el titular (nombre y RUT) no se guarda en el historial. Sin Firebase queda en el dispositivo (lubri_plkh). */
    const plkOtros = x => {
        const V = new Set(['marca', 'modelo', 'version', 'motor', 'comb', 'cil', 'trans', 'anio', 'color', 'km', 'rt', 'vin', 'nmotor', 'tipov'].map(k => plkNorm(x[k] ?? '')).filter(Boolean));
        return (x.extra || []).filter(([k, v]) => !V.has(plkNorm(v)) && !/^(owner|titular)/i.test(k)).slice(0, 60).map(([k, v]) => k + ': ' + v).join('\n')
    }; // v9-8-6: lo que devuelve la API y no tiene campo propio va a «Otros datos del vehículo»
    const PLK_DIAS = 30; // una consulta más reciente que esto se muestra desde el historial
    const PLKC = () => DM() ? 'demo_consultas_patente' : 'consultas_patente',
        PLK_KEYS = ['marca', 'modelo', 'anio', 'version', 'motor', 'cil', 'comb', 'trans', 'color', 'km', 'rt', 'vin', 'nmotor', 'tipov'];
    async function plkGet(pat) {
        try {
            if (fb && fb.f && fb.db) {
                const g = await fb.f.getDoc(fb.f.doc(fb.db, PLKC(), pat));
                return g.exists() ? g.data() : null
            }
            const M = JSON.parse(localStorage.lubri_plkh || '{}');
            return M[pat] || null
        } catch (e) {
            console.warn('historial: no se pudo leer', e);
            return null
        }
    }
    async function plkAll() {
        // v9-8-6: todas las patentes consultadas (historial completo)
        try {
            if (fb && fb.f && fb.db) {
                const q = await fb.f.getDocs(fb.f.collection(fb.db, PLKC()));
                return q.docs.map(d => d.data())
            }
            return Object.values(JSON.parse(localStorage.lubri_plkh || '{}'))
        } catch (e) {
            console.warn('historial: no se pudo leer', e);
            return []
        }
    }
    async function plkLog(pat, src, x) {
        const datos = {};
        for (const k of PLK_KEYS) {
            const v = x[k];
            if (v != null && v !== '' && v !== 0)
                datos[k] = v
        }
        if (x.extra && x.extra.length)
            datos.extra = x.extra; // v9-8-5: resto de los datos que devolvió la API (sin titular)
        if (!Object.keys(datos).length)
            return null;
        const iso = now(),
            sig = JSON.stringify(datos);
        const upd = old => {
            const d = old && typeof old == 'object' ? old : {
                patente: pat,
                patenteN: pat,
                primera: iso,
                consultas: 0,
                historial: []
            };
            d.historial = Array.isArray(d.historial) ? d.historial : [];
            const last = d.historial[d.historial.length - 1];
            if (last && JSON.stringify(last.datos) == sig) {
                last.vistoISO = iso;
                last.veces = (last.veces || 1) + 1
            } else
                d.historial.push({
                    fechaISO: iso,
                    vistoISO: iso,
                    veces: 1,
                    fuente: src,
                    autor: autor(),
                    datos
                });
            if (d.historial.length > 60)
                d.historial = d.historial.slice(-60);
            d.patente = pat;
            d.patenteN = pat;
            d.ultima = iso;
            d.consultas = (d.consultas || 0) + 1;
            d.ultimo = {
                fuente: src,
                datos
            };
            return d
        };
        if (fb && fb.f && fb.db) {
            const F = fb.f,
                ref = F.doc(fb.db, PLKC(), pat);
            let old = null;
            try {
                const g = await F.getDoc(ref);
                if (g.exists())
                    old = g.data()
            } catch (e) {
                console.warn('historial: no se pudo leer', e)
            }
            const d = upd(old);
            await F.setDoc(ref, d);
            return d
        }
        let M = {};
        try {
            M = JSON.parse(localStorage.lubri_plkh || '{}')
        } catch (e) {}
        const d = upd(M[pat]);
        M[pat] = d;
        try {
            localStorage.lubri_plkh = JSON.stringify(M)
        } catch (e) {}
        return d
    }

    async function plkRun(d, force) {
        // v9-11: si la patente se consultó hace poco muestra el último dato guardado; force = consultar de nuevo y actualizar el historial
        if (!FEATURE_BUSCAR_PATENTE || R.plk)
            return;
        const c = plkCtxOf(d);
        if (!c)
            return;
        const pat = plkPat(c);
        if (pat.length < 5)
            return toast('warning', 'Escribe la patente completa');
        R.plk = 1;
        render(1);
        try {
            let x = null,
                src = '',
                e1 = '',
                H = null,
                fromH = false;
            if (!force) {
                H = await plkGet(pat);
                if (H && H.ultima && H.ultimo && H.ultimo.datos && Date.now() - Date.parse(H.ultima) < PLK_DIAS * 864e5) {
                    x = {
                        ...H.ultimo.datos
                    };
                    src = 'Historial · consulta del ' + fdt(H.ultima);
                    fromH = true
                }
            }
            if (!x) {
                toast('search', 'Consultando ' + pat + '…');
                if (BK()) {
                    try {
                        x = await boostrFetch(pat);
                        src = 'Boostr Chile'
                    } catch (e) {
                        e1 = e instanceof TypeError ? 'Boostr no respondió (sin conexión o bloqueo CORS)' : e.message
                    }
                }
                if (!x) {
                    try {
                        x = await plkFetch(pat);
                        src = 'OpenAPI Chile'
                    } catch (e) {
                        throw new Error(e1 || (e instanceof TypeError ? 'No se pudo consultar (sin conexión o bloqueo CORS)' : e.message))
                    }
                }
                try {
                    H = await plkLog(pat, src, x)
                } catch (e) {
                    console.warn('historial de patente no guardado', e);
                    toast('warning', 'Los datos no se pudieron guardar en el historial')
                }
            }
            const rows = [],
                on = {},
                add = (L, sec) => {
                    for (const [k, lbl] of L) {
                        const nw = String(x[k] ?? '').trim();
                        if (!nw || nw == '0')
                            continue;
                        const cur = plkCur(c, sec, k);
                        if (cur.trim().toLowerCase() == nw.toLowerCase())
                            continue;
                        rows.push({
                            k,
                            lbl,
                            sec,
                            nw,
                            cur
                        });
                        on[sec + ':' + k] = sec == 'v' ? true : !cur
                    }
                };
            if (!x.otros)
                x.otros = plkOtros(x);
            add(PLK_V, 'v');
            add(PLK_C, 'c');
            R.plk = 0;
            if (!rows.length && !fromH && !(x.extra && x.extra.length)) {
                render(1);
                return toast('info', 'La consulta no trajo datos nuevos')
            }
            S.plkp = {
                ctx: c.ctx,
                kind: 'pat',
                pat: pat,
                src: (e1 && src != 'Boostr Chile' ? src + ' (Boostr falló: ' + e1 + ')' : src),
                rows,
                on,
                h: H,
                fromH,
                extra: x.extra || [],
                tit: x.titular || []
            };
            plkOpen(c.ctx)
        }
        catch (e) {
            R.plk = 0;
            render(1);
            toast('warning', e.message)
        }
    }

                cy = new Date().getFullYear() + 1,
                gens = [];
            const GA = mo && typeof mo == 'object' ? (Object.values(mo).find(v => Array.isArray(v) && v.length && typeof v[0] == 'object') || []) : [];
            for (const g of GA) {
                const nums = [];
                let open = false;
                const walk = (k, v) => {
                    if (v == null)
                        return;
                    if (typeof v == 'object') {
                        for (const [kk, vv] of Object.entries(v))
                            walk(kk, vv);
                        return
                    }
                    const t = String(v);
                    if (/present|н\.?\s?в|now|actual|current/i.test(t) && /year|to|end|prod|until|range|period/i.test(k + t))
                        open = true;
                    if (/year|from|to|start|end|prod|since|until|range|period|date/i.test(k)) {
                        (t.match(/(19|20)\d\d/g) || []).forEach(n => nums.push(+n))
                    }
                };
                walk('', g);
                if (nums.length) {
                    const nn = nums.filter(n => n >= 1950 && n <= cy + 1);
                    if (!nn.length)
                        continue;
                    const f = Math.min(...nn),
                        e = Math.max(...nn);
                    gens.push({
                        from: f,
                        to: (open || nums.length == 1 && f >= cy - 3) ? cy : e,
                        label: String(g.name || g.title || g.generation || g.code || g.slug || '').slice(0, 40)
                    })
                }
            }
            if (gens.length) {
                const ys = new Set();
                gens.forEach(g => {
                    for (let y = Math.min(g.from, g.to); y <= Math.min(Math.max(g.from, g.to), cy); y++)
                        ys.add(y)
                });
                P.gens = gens;
                P.years = [...ys].sort((x, y) => y - x)
            }
        } catch (e) {
            console.warn('catálogo: sin años', e)
        }
        P.yl = 0;
        if (S.plkp === P)
            render(1)
    }

    function lista() {

        if (k == 'ayer')

        }

                return new Date(+y, m - 1, +d)
            };

        }

    }

        }

         ${acc('cat', 'Catálogo de servicios', 'Servicios, grupos y minutos estándar', `<div class="note">Minutos = tiempo estándar estimado. El código interno no cambia al renombrar.</div>${[...new Set(S.cfg.catalogo.map(c => c.grupo))].map(g => `<div class="sm" style="margin-top:8px;font-weight:700">${esc(g)}</div>${S.cfg.catalogo.map((c, i) => c.grupo == g ? `<div class="li"><span>${esc(c.nombre)} <small class="mut">· ${c.cat}</small></span><input type="number" min="1" value="${c.min}" data-ch="min" data-i="${i}" aria-label="Minutos"><button data-a="svdel" data-i="${i}" title="Eliminar">${ic('delete')}</button></div>` : '').join('')}`).join('')}
         <div class="fld"><input class="w" id="sv_n" placeholder="Nombre del servicio"><select id="sv_gs" data-ch="svgs">${[...new Set(S.cfg.catalogo.map(c => c.grupo))].map(g => `<option>${esc(g)}</option>`).join('')}<option value="__new">＋ Nuevo grupo…</option></select><input id="sv_g" placeholder="Nombre del nuevo grupo" style="display:none"><select id="sv_c"><option value="cambiar">Categoría: Cambiar</option><option value="revisar">Categoría: Revisar</option></select><input id="sv_m" type="number" min="1" placeholder="Minutos"><button class="w" data-a="svadd">${ic('add')} Agregar servicio</button></div>`)}

         <section><b>Conexión y datos</b><p class="note">${fb ? (DM() ? 'Firebase conectado · modo DEMO: se usan las colecciones separadas demo_trabajos y demo_config; tus datos reales no se tocan.' : 'Firebase conectado (tiempo real) · datos REALES.') : (S.fbErr ? 'SIN CONEXIÓN a Firebase: ' + esc(S.fbErr) + '. Los datos se guardan solo en este navegador.' : 'Modo demo: datos solo en este navegador. Pega tu config de Firebase en el archivo.')}</p><div class="btns">${fb ? `<button data-a="ping">${ic('wifi_tethering')} Probar conexión</button>` : ''}<button data-a="exp">${ic('download')} Exportar JSON</button><button data-a="rst">${ic('restart_alt')} Catálogo base</button></div></section>

    /* ============ v4 · FOTOS DEL VEHÍCULO ============
       1) Cada foto se comprime (máx. 1600 px, JPEG) y se guarda PRIMERO en el teléfono (IndexedDB «lubfotos»): respaldo local que funciona sin conexión.
       2) Con conexión se sube a Cloudinary (fotos/<colección>/<orden>/<zona>_<id>) y la orden guarda solo el enlace; los pendientes se reintentan solos.
       3) Un sitio web NO puede escribir en la galería en silencio: el botón «Guardar en la galería» usa la hoja de compartir del teléfono («Guardar imagen») con todas las fotos pendientes.

    const FZ = [{

        }, {

            y: 50
        }, {

            n: 'Lado der.',
            x: 92,
            y: 50
        }, {
            k: 'roof',
            n: 'Techo',

            y: 50
        }, {
            k: 'rl',
            n: 'Trasera izq.',

    const FDB = (() => {
        let p;
        const open = () => p || (p = new Promise((res, rej) => {

                r.onupgradeneeded = () => r.result.createObjectStore('f', {

                });

            } catch (e) {

            }
        }).catch(e => {
            p = null;

        }));
        const tx = async (m, f) => {
            const db = await open();
            return new Promise((res, rej) => {
                const t = db.transaction('f', m),
                    s = t.objectStore('f');

                    out = f(s)
                } catch (e) {

        if (m.k == 'cita')
            return citaModal();
        if (m.k == 'plkr')
            return plkBox();
        if (m.k == 'rcs')
            return rcModal();
        if (m.k == 'subz')
            return subz();

            return kpi(m.id);

            }
            if (l) {

        };

                }

                dateStyle: 'short',
                timeStyle: 'short'
            }), W - P, 84, '400 28px', '#6b6b6b', 'right');

            let y = cy + 44;

            while (c.measureText(pat).width > pw - 120 && fs > 30) {

            }

            while (c.measureText(ot).width > IW - pw - 150 && of > 28) {

                c.font = `700 ${of}px ${F}`
            }
            const ow = Math.max(250, c.measureText(ot).width + 80),

            if (j.ot) {

            }
            else {

            }
            y += ph + 36;

            }
            // estado y cronómetro

            ln(y);
            y += 54;
            c.beginPath();

            T(c, ESTADO[sc(j)], X + 52, y, '700 46px', '#111');

            y += 26;
            T(c, 'D  :  H  :  M  :  S', X + IW, y, '400 18px', '#999', 'right', '2px');
            y += 22;
            const mp = j.pausa ? (nm(S.cfg.motivos, j.pausa.motivo) == '—' ? j.pausa.motivo : nm(S.cfg.motivos, j.pausa.motivo)) : '';
            y = wrap(c, `Asignado a ${nm(S.cfg.mecanicos, j.mecanicoId)} · ${nm(S.cfg.plataformas, j.plataformaId)}`, X, y + 20, IW, 40, '400 30px', '#444');
            y = wrap(c, `Ingresada por ${j.ingresadoPor?.nombre || '—'} · Ingreso ${hm(t.ingresoISO)}`, X, y, IW, 40, '400 30px', '#444');
            T(c, `Estimado ${Math.round(t.estSeg / 60)} min${tx ? ' · ' + tx : ''}${mp ? ' · Pausa: ' + mp : ''}`, X, y, '700 30px', cl == 'atraso' ? '#e11d1d' : cl == 'vencer' ? '#b86e00' : '#111');
            y += 14;
            // vehículo
            y += 18;
            ln(y);
            y += 46;
            hd('DATOS DEL VEHÍCULO', y);
            y += 18;
            for (const l of [[v.marca, v.modelo, v.version].filter(Boolean).join(' '), [v.motor, v.combustible].filter(Boolean).join(' · ')].filter(Boolean)) {

            }

            // servicios y repuestos
            const sv = k => j.servicios.filter(s => s.cat == k).map(s => ({

            }));
            y += 26;
            ln(y);
            y += 46;

            // otros datos

            if (op.length) {

                }

            }
            // notas

                    continue;
                y += 22;
                ln(y);
                y += 46;
                hd(tl, y);
                y += 42;
                for (const n of ns) {
                    y = wrap(c, n.texto, X, y, IW, 40, '400 30px', '#111');

                }

            }
            const cb = y + 36;

            return cb + 100
        };
        const H = draw(Object.assign(document.createElement('canvas'), {
                width: W,
                height: 10
            }).getContext('2d')),
            cv = Object.assign(document.createElement('canvas'), {
                width: W,

    }

    function editSave(pat) {
        // guarda los cambios de una orden existente (no crea una nueva, no toca estado ni cronómetro)
        const j = get(D._edit);
        if (!j) {
            S.modal = null;
            return render(1)
        }
        if (j.estado == 'proceso' && D.plat != j.plataformaId && S.jobs.some(x => x.plataformaId == D.plat && x.estado == 'proceso' && x.id != j.id))
            return toast('warning', 'Ya hay un trabajo en proceso en esa sub-zona');
        const e1 = (j.eventos || []).find(x => x.tipo == 'iniciado'),
            tI = j.tiempos,
            ni = D.iniD ? new Date(D.iniD).getTime() : NaN,
            nf = D.finD ? new Date(D.finD).getTime() : NaN;
        let dI = 0,
            dF = 0;
        if (e1 && !isNaN(ni)) {
            const o0 = Date.parse(e1.fechaISO);
            if (Math.abs(ni - o0) >= 6e4)
                dI = ni - o0
        }
        if (j.estado == 'completado' && tI.completadoISO && !isNaN(nf)) {
            const o0 = Date.parse(tI.completadoISO);
            if (Math.abs(nf - o0) >= 6e4)
                dF = nf - o0
        }
        if (dI || dF) {
            const sI = e1 ? (dI ? ni : Date.parse(e1.fechaISO)) : 0,
                sF = dF ? nf : Date.parse(tI.completadoISO || 0);
            if (dI && ni > Date.now() + 6e4)
                return toast('warning', 'El inicio no puede estar en el futuro');
            if (dF && nf > Date.now() + 6e4)
                return toast('warning', 'El fin no puede estar en el futuro');
            if (j.estado == 'completado' && sF <= sI)
                return toast('warning', 'El fin debe ser posterior al inicio');
            const w = j.estado == 'completado' ? tI.realSeg + (dF - dI) / 1000 : el(j) - dI / 1000;
            if (w < 0)
                return toast('warning', 'Esas horas dejarían un tiempo trabajado negativo')
        }
        const cat = S.cfg.catalogo,
            v = j.vehiculo,
            o = j.opciones || {},
            ch = [],
            pe = personas().find(q => q.id == D.ing);
        const sv = D.svc.map(c => {
            const e = j.servicios.find(x => x.cod == c);
            if (e)
                return e;
            const x = cat.find(y => y.cod == c);
            return x && {
                    cod: x.cod,
                    nombre: x.nombre,
                    grupo: x.grupo,
                    cat: x.cat,
                    estSeg: x.min * 60,
                    hecho: false
                }
        }).filter(Boolean)
        .concat(D.custom.map(n => j.servicios.find(x => x.cod == 'OTRO' && x.nombre == n) || {
            cod: 'OTRO',
            nombre: n,
            grupo: 'Otros',
            cat: 'cambiar',
            estSeg: 1800,
            hecho: false
        }));
        const nw = {
            patente: (D.patente || '').toUpperCase(),
            marca: D.marca || '',
            modelo: D.modelo || '',
            version: D.version || '',
            motor: D.motor || '',
            combustible: D.comb || '',
            transmision: D.trans || '',
            km: +D.km || 0,
            color: D.color || '',
            cil: D.cil || '',
            anio: +D.anio || '',
            rt: D.rt || '',
            nmotor: D.nmotor || '',
            tipov: D.tipov || '',
            otros: D.otros || ''
        };
        for (const k in nw)
            if ((v[k] || '') != (nw[k] || ''))
                ch.push(k);
        const ot = (D.ot || '').trim();
        if ((j.ot || '') != ot)
            ch.push('OT');
        if ((j.cliente.nombre || '') != (D.nombre || '') || (j.cliente.telefono || '') != (D.tel || '') || (j.cliente.rut || '') != (D.rut || '') || (j.cliente.direccion || '') != (D.dir || '') || (j.cliente.correo || '') != (D.correo || ''))
            ch.push('cliente');
        if (j.plataformaId != D.plat)
            ch.push('plataforma');
        if ((j.mecanicoId || '') != (D.mec || ''))
            ch.push('mecánico');
        if (pe && pe.id != j.ingresadoPor?.id)
            ch.push('ingresada por');
        if (j.prioridad != (D.prio || 'normal'))
            ch.push('prioridad');
        const a1 = a => a.map(x => x.cod + x.nombre).sort().join('|'),
            a2 = a => a.map(r => r.grupo + r.nombre + r.cant).sort().join('|');
        if (a1(sv) != a1(j.servicios))
            ch.push('servicios');
        if (a2(D.rep) != a2(j.repuestos))
            ch.push('repuestos');
        if ((j.modo || 'proceso') != (D.modo || 'proceso'))
            ch.push('tipo de trabajo');
        const rt = RT(D);
        if (JSON.stringify(j.ruta || null) != JSON.stringify(rt.ruta) || JSON.stringify(j.rutaM || null) != JSON.stringify(rt.rutaM))
            ch.push('ruta');
        if ((o.entregaISO || '') != entISO(D))
            ch.push('entrega prometida');
        Object.assign(v, nw);
        v.patenteN = pat;
        j.ot = ot;
        j.cliente = {
            nombre: D.nombre || '',
            telefono: D.tel || '',
            rut: D.rut || '',
            direccion: D.dir || '',
            correo: D.correo || ''
        };
        j.plataformaId = D.plat;
        j.mecanicoId = D.mec || '';
        if (pe)
            j.ingresadoPor = {
                id: pe.id,
                nombre: pe.nombre
            };
        j.prioridad = D.prio || 'normal';
        j.servicios = sv;
        j.repuestos = D.rep;
        j.modo = D.modo || 'proceso';
        j.ruta = rt.ruta;
        j.rutaM = rt.rutaM;
        j.paso = rt.paso;
        j.fotos = D.fotos || [];
        j.opciones = {
            espera: !!D.espera,
            entregaISO: entISO(D),
            vin: (D.vin || '').trim().toUpperCase(),
            nivelComb: D.nivel || ''
        };
        const ne = D._estEdit && +D.estMin > 0 ? Math.round(+D.estMin * 60 * EF[D.estU || 'min']) : sv.reduce((a, x) => a + x.estSeg, 0);
        if (Math.abs(ne - j.tiempos.estSeg) >= 60)
            ch.push('tiempo estimado');
        j.tiempos.estSeg = ne;
        if (D.ingreso && D.ingreso !== hhmm(j.tiempos.ingresoISO)) {
            const d = new Date(j.tiempos.ingresoISO),
                [h, m] = D.ingreso.split(':');
            d.setHours(+h, +m, 0, 0);
            j.tiempos.ingresoISO = d.toISOString();
            ch.push('ingreso')
        }
        if (dI || dF) {
            const ev0 = e1 && e1.fechaISO,
                f0 = tI.completadoISO;
            if (dI) {
                e1.fechaISO = new Date(ni).toISOString();
                ch.push('inicio ' + fdt(ev0) + ' → ' + fdt(e1.fechaISO))
            }
            if (dF) {
                tI.completadoISO = new Date(nf).toISOString();
                const ec = [...j.eventos].reverse().find(x => x.tipo == 'completado');
                if (ec)
                    ec.fechaISO = tI.completadoISO;
                ch.push('fin ' + fdt(f0) + ' → ' + fdt(tI.completadoISO))
            }
            if (j.estado == 'completado') {
                tI.realSeg = Math.max(0, Math.round(tI.realSeg + (dF - dI) / 1000));
                tI.acumSeg = tI.realSeg
            } else if (dI)
                tI.acumSeg = Math.max(0, tI.acumSeg - dI / 1000)
        }
        const nn = (tp, x) => {
            if (x && x.trim()) {
                j.notas.push({
                    id: uid(),
                    tipo: tp,
                    texto: x.trim(),
                    autor: autor(),
                    fechaISO: now()
                });
                ch.push('nota')
            }
        };
        nn('orden', D.notaO);
        nn('vehiculo', D.notaV);
        if (j.estado == 'completado')
            j.tiempos.desvSeg = j.tiempos.realSeg - j.tiempos.estSeg;
        if (ch.length)
            ev(j, 'editado', ch.join(', '));
        const h = (S.view == 'home' || S.view == 'mapa') && S.open == j.id;
        D = null;
        S.modal = null;
        mark('flash', j.id, 1300);
        saveJob(j);
        fotoKick();
        if (h)
            dashOut(j.id, 1);
        toast('check', 'Orden actualizada')
    }

        },

                } else

            }

                ev(j, 'repuesto', (i < 0 ? 'agregado ' : 'quitado ') + d.n)
            }

                    });
                    j.tiempos.estSeg += c.min * 60
                } else {

                }

            }

        let c,

        return {
            play(k, id) {
                try {
                    c = c || new (window.AudioContext || window.webkitAudioContext)();
                    if (c.state == 'suspended')
                        c.resume();
                    HK.stop(id);
                    const t = c.currentTime,
                        g = c.createGain(),
                        tk = k == 'truck',
                        b = tk ? 92 + (id % 4) * 7 : 340 + (id % 6) * 22,
                        d = tk ? .9 : .32,
                        a = tk ? .16 : .09,
                        o = [b, b * 1.25].map(f => {
                            const x = c.createOscillator();
                            x.type = tk ? 'sawtooth' : 'square';
                            x.frequency.value = f;
                            x.connect(g);
                            x.start(t);
                            x.stop(t + d + .05);
                            return x
                        });
                    g.gain.setValueAtTime(0, t);
                    g.gain.linearRampToValueAtTime(a, t + .03);
                    g.gain.setValueAtTime(a, t + d - .08);
                    g.gain.linearRampToValueAtTime(0, t + d);
                    g.connect(c.destination);
                    cur[id] = g;
                    o[0].onended = () => {
                        if (cur[id] === g)
                            delete cur[id]
                    }
                } catch (e) {}
            },
            stop(id) {
                const g = cur[id];
                if (g) {
                    try {
                        g.gain.cancelScheduledValues(c.currentTime);
                        g.gain.setValueAtTime(g.gain.value, c.currentTime);
                        g.gain.linearRampToValueAtTime(0, c.currentTime + .04)
                    } catch (e) {}
                    delete cur[id]
                }
            }
        }

    const bcW = s => [...s].map((c, i) => (i % 2 ? '0' : '1').repeat(+c)).join(''),
        bcOk = d => {
            const a = d.split('').map(Number),
                c = a.pop();
            let s = 0;
            for (let i = a.length - 1, w = 3; i >= 0; i--, w = w == 3 ? 1 : 3)
                s += a[i] * w;
            return (10 - s % 10) % 10 == c
        };
    function bcKind(v, f) {
        f = String(f || '').toLowerCase().replace(/[^a-z0-9]/g, '');
        if (/^\d{13}$/.test(v) && bcOk(v) && (!f || f == 'ean13'))
            return 'ean13';
        if (/^\d{12}$/.test(v) && bcOk(v) && (!f || f == 'upca'))
            return 'upca';
        if (/^\d{8}$/.test(v) && bcOk(v) && (!f || f == 'ean8'))
            return 'ean8';
        if (f == 'code39' && [...v.toUpperCase()].every(c => BC.c39[c] && c != '*'))
            return 'code39';
        return 'code128'
    }
    function bcMods(v, k) {
        if (k == 'upca') {
            v = '0' + v;
            k = 'ean13'
        }
        if (k == 'ean13') {
            const d = v.split('').map(Number),
                P = BC.P[d[0]];
            let s = '101';
            for (let i = 1; i < 7; i++)
                s += BC[P[i - 1]][d[i]];
            s += '01010';
            for (let i = 7; i < 13; i++)
                s += BC.R[d[i]];
            return s + '101'
        }
        if (k == 'ean8') {
            const d = v.split('').map(Number);
            let s = '101';
            for (let i = 0; i < 4; i++)
                s += BC.L[d[i]];
            s += '01010';
            for (let i = 4; i < 8; i++)
                s += BC.R[d[i]];
            return s + '101'
        }
        if (k == 'code39')
            return [...('*' + v.toUpperCase() + '*')].map(c => bcW(BC.c39[c])).join('0');
        const s = [...v].map(c => {
                const n = c.charCodeAt(0);
                return n >= 32 && n <= 126 ? c : '?'
            }).join(''),
            dg = /^\d+$/.test(s) && s.length >= 4;
        let codes;
        if (dg) {
            const o = s.length % 2;
            codes = o ? [104, s.charCodeAt(0) - 32, 99] : [105];
            for (let i = o; i < s.length; i += 2)
                codes.push(+s.slice(i, i + 2))
        }
        else
            codes = [104, ...[...s].map(c => c.charCodeAt(0) - 32)];
        let sum = codes[0];
        for (let i = 1; i < codes.length; i++)
            sum += codes[i] * i;
        codes.push(sum % 103, 106);
        return codes.map(c => bcW(BC.c128[c])).join('')
    }
    function bcSvg(v, f, o) {
        o = o || {};
        v = String(v);
        const k = bcKind(v, f),
            m = bcMods(v, k),
            q = 10,
            W = m.length + 2 * q,
            H = o.h || 80;
        let r = '',
            i = 0;
        while (i < m.length) {
            if (m[i] == '1') {
                let j = i;
                while (m[j] == '1')
                    j++;
                r += `<rect x="${q + i}" y="0" width="${j - i}" height="${H}"/>`;
                i = j
            } else
                i++
        }
        return `<svg class="bcs" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" shape-rendering="crispEdges" role="img" aria-label="Código de barras ${esc(v)}"><rect width="${W}" height="${H}" fill="#fff"/><g fill="#000">${r}</g></svg>`
    }
    async function bcPrep(file) {
        const bmp = await (window.createImageBitmap ? createImageBitmap(file, {
            imageOrientation: 'from-image'
        }).catch(() => null) : null) || await new Promise((res, rej) => {
            const i = new Image(),
                u = URL.createObjectURL(file);
            i.onload = () => {
                res(i);
                setTimeout(() => URL.revokeObjectURL(u), 0)
            };
            i.onerror = rej;
            i.src = u
        });
        const w = bmp.width || bmp.naturalWidth,
            h = bmp.height || bmp.naturalHeight,
            s = Math.min(1, 1800 / Math.max(w, h)),
            c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(w * s));
        c.height = Math.max(1, Math.round(h * s));
        c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
        if (bmp.close)
            bmp.close();
        return c
    }
    let ZXP;
    const bcZX = () => ZXP || (ZXP = new Promise((res, rej) => {
        if (window.ZXing)
            return res(window.ZXing);
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
        s.onload = () => window.ZXing ? res(window.ZXing) : rej(new Error('zxing'));
        s.onerror = () => {
            ZXP = null;
            rej(new Error('sin red'))
        };
        document.head.appendChild(s)
    }));
    async function bcDecode(file) {
        const c = await bcPrep(file);
        if ('BarcodeDetector' in window) {
            try {
                const fm = await BarcodeDetector.getSupportedFormats?.(),
                    d = new BarcodeDetector(fm && fm.length ? {
                        formats: fm
                    } : undefined),
                    r = await d.detect(c);
                if (r && r.length && r[0].rawValue)
                    return {
                        v: r[0].rawValue,
                        f: r[0].format
                    }
            } catch (e) {
                console.warn('BarcodeDetector', e)
            }
        }
        try {
            const Z = await bcZX(),
                rd = new Z.BrowserMultiFormatReader(new Map([[Z.DecodeHintType.TRY_HARDER, true]])),
                r = await rd.decodeFromImageUrl(c.toDataURL('image/jpeg', .92)),
                tx = r.getText();
            if (tx)
                return {
                    v: tx,
                    f: String(Z.BarcodeFormat[r.getBarcodeFormat()] || '').toLowerCase()
                }
        } catch (e) {
            console.warn('zxing', e)
        }
        return null
    }
    const repGet = (x, i) => x == 'new' ? ((D && D.rep) || [])[i] : ((get(x) || {}).repuestos || [])[i],
        repNew = (g, n) => {
            const c = (S.cfg.repuestos || []).find(r => r.grupo == g && r.nombre == n) || {},
                o = {
                    grupo: g,
                    nombre: n,
                    cant: 1
                };
            if (c.cod)
                o.cod = c.cod;
            if (c.bc)
                o.bc = {
                    ...c.bc
                };
            if (c.precio)
                o.precio = c.precio;
            return o
        };
    function repApply(x, i, p) {
        const it = repGet(x, i);
        if (!it)
            return;
        let c = S.cfg.repuestos.find(r => r.grupo == it.grupo && r.nombre == it.nombre);
        if (!c) {
            c = {
                grupo: it.grupo,
                nombre: it.nombre
            };
            S.cfg.repuestos.push(c)
        }
        if ('cod' in p) {
            if (p.cod) {
                it.cod = p.cod;
                c.cod = p.cod
            } else {
                delete it.cod;
                delete c.cod
            }
        }
        if ('bc' in p) {
            if (p.bc) {
                it.bc = {
                    ...p.bc
                };
                c.bc = {
                    ...p.bc
                }
            } else {
                delete it.bc;
                delete c.bc
            }
        }
        if ('precio' in p) {
            if (p.precio) {
                it.precio = p.precio;
                c.precio = p.precio
            } else {
                delete it.precio;
                delete c.precio
            }
        }
        if (x != 'new') {
            const j = get(x);
            if (j) {
                ev(j, 'repuesto', 'datos de ' + it.nombre);
                saveJob(j, 1)
            }
        }
        saveCfg()
    }
    function repModal(o) {
        const x = o.x,
            i = o.i,
            it = repGet(x, i);
        if (!it)
            return '';
        const pat = x == 'new' ? (D && D.patente ? esc(D.patente) : 'Orden nueva') : esc(((get(x) || {
                vehiculo: {}
            }).vehiculo || {}).patente || ''),
            bc = it.bc,
            k = bc ? bcKind(bc.v, bc.f) : '';
        return `<div class="bd" data-a="cerrar"><div class="box"><b style="font-size:18px">${esc(it.nombre)}</b><div class="sm">${esc(it.grupo || '')} · ${pat}</div>
         <label class="sm" for="rp_c" style="display:block;margin-top:10px;text-align:left">Código o nombre del producto</label><input id="rp_c" style="width:100%" placeholder="Código del proveedor, medida, etc." value="${esc(it.cod || '')}" maxlength="60" autocomplete="off">
         <label class="sm" for="rp_p" style="display:block;margin-top:12px;text-align:left">Precio del repuesto (opcional)</label><input id="rp_p" type="text" inputmode="numeric" style="width:100%" placeholder="Ej: 12990" value="${it.precio ? esc(String(it.precio)) : ''}" maxlength="10" autocomplete="off">
         <div class="sm" style="margin-top:12px;text-align:left">Código de barras</div>
         ${bc ? `<div id="rp_prev"><div class="bcbox">${bcSvg(bc.v, bc.f, {h: 70})}<div class="bcv">${esc(bc.v)}</div>${k == 'code128' && /^(ean|upc|code39|code128|)/.test(String(bc.f || '').toLowerCase().replace(/[^a-z0-9]/g, '')) && bc.f && !/code128|code39/.test(String(bc.f).toLowerCase().replace(/[^a-z0-9]/g, '')) ? '<div class="sm">Se dibuja como Code 128 (mismo texto).</div>' : ''}</div></div><div class="btns" style="flex-wrap:wrap"><button type="button" data-a="bcshow" data-x="${x}" data-i="${i}">${ic('fullscreen')} Mostrar para escanear</button><button type="button" data-a="rpclr" data-x="${x}" data-i="${i}">${ic('delete')} Quitar</button></div>` : '<div id="rp_prev"><div class="sm" style="text-align:left">Aún no tiene código de barras.</div></div>'}
         <div class="btns" style="flex-wrap:wrap;margin-top:8px"><button type="button" data-a="rpscan" data-x="${x}" data-i="${i}">${ic('photo_camera')} ${bc ? 'Escanear de nuevo' : 'Foto del código de barras'}</button><button type="button" data-a="rpscan" data-g="1" data-x="${x}" data-i="${i}">${ic('photo_library')} Galería</button></div>
         <div class="rpb"><input id="rp_b" placeholder="Código de barras (texto)" maxlength="60" autocomplete="off" value="${esc(bc ? bc.v : '')}"><button type="button" data-a="rpuse" data-x="${x}" data-i="${i}" title="Copiar el código de arriba al código de barras">${ic('content_copy')} Usar código</button></div><div class="sm" style="text-align:left">Los dos campos se pueden editar por separado.</div>
         <div class="btns" style="margin-top:14px"><button type="button" data-a="rpsave" data-x="${x}" data-i="${i}">Guardar</button><button type="button" data-a="cerrar">Cerrar</button></div></div></div>`
    }
    let BCWL = null;
    async function bcWake(on) {
        try {
            if (on) {
                BCWL = await navigator.wakeLock?.request('screen')
            } else if (BCWL) {
                BCWL.release();
                BCWL = null
            }
        } catch (e) {}
    }
    const bcFull = () => S.bcv ? `<div class="bcfs" data-a="bcx"><div class="bcin"><div class="bcn">${esc(S.bcv.n || '')}</div>${bcSvg(S.bcv.v, S.bcv.f, {h: 160})}<div class="bcv">${esc(S.bcv.v)}</div><div class="bch">Sube el brillo al máximo y acerca la pistola · toca para cerrar</div></div></div>` : '';
    document.addEventListener('input', e => {
        if (e.target.id != 'rp_b')
            return;
        const v = e.target.value.trim().slice(0, 60),
            pv = document.getElementById('rp_prev');
        if (pv && v)
            pv.innerHTML = `<div class="bcbox">${bcSvg(v, '', {h: 70})}<div class="bcv">${esc(v)}</div><div class="sm">Vista previa · toca Guardar para conservarlo</div></div>`
    }); // v9-7: el código de barras se dibuja mientras se escribe
    Object.assign(A, {
        rpuse: d => {
            const c = ($('#rp_c')?.value || '').trim().slice(0, 60);
            if (!c) {
                toast('warning', 'Escribe primero el código del producto');
                $('#rp_c')?.focus();
                return
            }
            repApply(d.x, +d.i, {
                cod: c,
                bc: {
                    v: c,
                    f: ''
                }
            });
            render(1);
            toast('check', 'Código de barras generado: ' + c)
        },
        // v9-7: copia Código → código de barras y lo genera
        ifoto: d => inspPick(d.x, 0),
        igal: d => inspPick(d.x, 1),
        repm: d => {
            if (d.x == 'new') {
                collect();
                S.ov = {
                    k: 'rep',
                    x: 'new',
                    i: +d.i
                }
            } else
                S.modal = {
                    k: 'rep',
                    id: d.x,
                    i: +d.i
                };
            render(1)
        },
        rpsave: d => {
            const x = d.x,
                i = +d.i,
                c = ($('#rp_c')?.value || '').trim().slice(0, 60),
                b = ($('#rp_b')?.value || '').trim().slice(0, 60),
                pr = ($('#rp_p')?.value || '').replace(/\D/g, '').slice(0, 9),
                p = {
                    cod: c,
                    precio: pr ? +pr : 0
                };
            if (b)
                p.bc = {
                    v: b,
                    f: ''
                };
            repApply(x, i, p);
            if (x == 'new')
                S.ov = null;
            else
                S.modal = null;
            toast('check', 'Repuesto actualizado');
            render(1)
        },
        rpclr: d => {
            repApply(d.x, +d.i, {
                bc: null
            });
            render(1)
        },
        rpscan: d => {
            const x = d.x,
                i = +d.i;
            if (x == 'new')
                collect();
            const inp = document.createElement('input');
            inp.type = 'file';
            inp.accept = 'image/*';
            if (!d.g)
                inp.setAttribute('capture', 'environment');
            inp.style.display = 'none';
            document.body.appendChild(inp);
            inp.addEventListener('cancel', () => inp.remove());
            inp.onchange = async () => {
                const f = inp.files[0];
                inp.remove();
                if (!f)
                    return;
                toast('qr_code_scanner', 'Leyendo código…');
                let r = null;
                try {
                    r = await bcDecode(f)
                } catch (e) {
                    console.warn(e)
                }
                if (!r || !r.v) {
                    toast('warning', 'No pude leer el código. Acércate, enfoca bien o escríbelo a mano');
                    return
                }
                repApply(x, i, {
                    bc: {
                        v: String(r.v).slice(0, 60),
                        f: r.f || ''
                    }
                });
                toast('check', 'Código guardado: ' + r.v);
                render(1)
            };
            inp.click()
        },
        bcshow: d => {
            const it = repGet(d.x, +d.i);
            if (!it || !it.bc)
                return;
            S.bcv = {
                v: it.bc.v,
                f: it.bc.f,
                n: it.nombre
            };
            bcWake(1);
            render(1)
        },
        bcx: () => {
            S.bcv = null;
            bcWake(0);
            render(1)
        }
    });

    /* ============ v9-5 · AGITAR 1 s → reiniciar táctil y pantalla ============
       Se detecta con el acelerómetro (devicemotion): golpes de agitación seguidos, sin pausas de más de 0,4 s, durante 1 s.
       Abre una ventana para confirmar o cancelar. «Reiniciar» no cierra la app ni borra datos: vuelve a medir la pantalla,
       suelta toques/temporizadores pegados y redibuja todo. En iPhone el sistema pide permiso la primera vez que se toca la pantalla. */
    const SHK = {
        t0: 0,
        last: 0,
        cool: 0,
        pn: null,
        need: 0,
        added: 0,
        on: () => {
            try {
                return localStorage.lubri_shake !== '0'
            } catch (e) {
                return true
            }
        }
    };
    function shkMotion(e) {
        if (!SHK.on() || document.hidden || MODO == 'sala')
            return;
        const a = e.accelerationIncludingGravity || e.acceleration;
        if (!a || a.x == null)
            return;
        const x = a.x || 0,
            y = a.y || 0,
            z = a.z || 0,
            now = performance.now(),
            q = SHK.pn,
            d = q ? Math.hypot(x - q[0], y - q[1], z - q[2]) : 0;
        SHK.pn = [x, y, z]; // cambio de aceleración entre dos lecturas seguidas
        if (d < 5)
            return; // movimiento normal (caminar, sostener, teclear): se ignora
        if (SHK.need) {
            if (now - SHK.last > 600) {
                SHK.need = 0;
                SHK.t0 = now
            } else {
                SHK.last = now;
                return
            }
        } // tras avisar, hay que parar de agitar antes de poder volver a avisar
        if (!SHK.t0 || now - SHK.last > 400)
            SHK.t0 = now; // se cortó la agitación: empieza de nuevo
        SHK.last = now;
        if (now - SHK.t0 >= 1000 && now > SHK.cool) {
            SHK.t0 = 0;
            SHK.need = 1;
            SHK.cool = now + 1500;
            shkAsk()
        }
    }
    function shkAsk() {
        if (S.shk) {
            if (performance.now() - S.shk.t > 2500)
                shkGo();
            return
        } // agitar otra vez con la ventana abierta = confirmar (por si el táctil no responde)
        try {
            navigator.vibrate?.([30, 40, 30])
        } catch (e) {}
        S.shk = {
            t: performance.now()
        };
        render(1)
    }
    function shkInit(force) {
        const DM_ = window.DeviceMotionEvent;
        if (!DM_ || !SHK.on())
            return;
        const add = () => {
            if (SHK.added)
                return;
            SHK.added = 1;
            addEventListener('devicemotion', shkMotion, {
                passive: true
            })
        };
        if (typeof DM_.requestPermission === 'function') {
            const ask = () => {
                removeEventListener('click', ask, true);
                try {
                    DM_.requestPermission().then(r => {
                        if (r === 'granted')
                            add()
                    }).catch(() => {})
                } catch (e) {}
            };
            if (force)
                ask();
            else
                addEventListener('click', ask, true)
        }
        else
            add()
    }
    function shkGo() {
        S.shk = null;
        resetUI()
    }
    function resetUI() {
        // reinicia táctil y redimensionado sin recargar la página
        try {
            clearTimeout(R.lt);
            R.lt = 0;
            R.lv = 0;
            clearTimeout(R.lp);
            for (const k of Object.keys(TAPG))
                delete TAPG[k];
            cancelAnimationFrame(vvSettle.r);
            for (const k of Object.keys(vvLast))
                delete vvLast[k];
            const de = document.documentElement,
                b = document.body;
            ['--vvh', '--vvt', '--avh'].forEach(k => de.style.removeProperty(k));
            b.classList.remove('vvkb', 'fabh');
            const ae = document.activeElement;
            if (ae && ae !== b && ae.blur)
                ae.blur();
            try {
                scrollTo(0, 0)
            } catch (e) {}
            de.style.touchAction = 'auto';
            b.style.display = 'none';
            void b.offsetHeight;
            b.style.display = '';
            de.style.touchAction = ''; // fuerza al navegador a recalcular el diseño y los toques
            vvSync();
            vvSettle(900);
            R.ah = R.mh = R.nv = null;
            S.toast = null;
            render(1);
            setTimeout(() => {
                try {
                    vvSync();
                    dispatchEvent(new Event('resize'))
                } catch (e) {}
            }, 150);
            toast('check', 'Táctil y pantalla reiniciados')
        } catch (e) {
            try {
                location.reload()
            } catch (z) {}
        }
    }
    const shkModal = () => S.shk ? `<div class="bd shkb" data-a="shkno"><div class="box c">${ic('touch_app', 'big t-mid')}<p><b>¿Reiniciar táctil y pantalla?</b></p><div class="sm">Detecté que agitaste el teléfono. Esto vuelve a medir la pantalla y destraba los toques, sin cerrar la app ni perder datos.</div><div class="btns" style="margin-top:16px"><button data-a="shkok">${ic('restart_alt')} Reiniciar</button><button data-a="shkno">Cancelar</button></div><div class="sm" style="margin-top:10px">Si no responde, agita otra vez para confirmar.</div></div></div>` : '';
    const shkSec = () => `<section><b>Táctil y pantalla</b><div class="note">Si la app se pega o se descuadra, agita el teléfono 1 s: aparece una ventana para reiniciar el táctil y el tamaño de pantalla.</div><div class="li"><span>Agitar para reiniciar</span><input type="checkbox" data-ch="shake" ${SHK.on() ? 'checked' : ''}></div><div class="btns"><button data-a="shkman">${ic('restart_alt')} Reiniciar ahora</button></div></section>`;
    Object.assign(A, {
        shkok: () => shkGo(),
        shkno: (d, b, e) => {
            if (e.target == b || b.tagName == 'BUTTON') {
                S.shk = null;
                render(1)
            }
        },
        shkman: () => {
            S.shk = {
                t: performance.now()
            };
            render(1)
        }
    });
    shkInit();
    try {
        screen.orientation && screen.orientation.lock && screen.orientation.lock('portrait').catch(() => {})
    } catch (e) {} // solo funciona instalada/pantalla completa; si no, se ignora

    await initDB();
    render(1);
    setTimeout(() => {
        fotoClean();
        fotoUp()
    }, 4000);
    if (MODO == 'sala')
        setTimeout(clk, 0);
    </script>
</body>
