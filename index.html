                })).concat(D.custom.map(n => ({
                    cod: 'OTRO',
                    nombre: n,
                    grupo: 'Otros',
                    cat: 'cambiar',
                    estSeg: 1800,
                    hecho: false
                })));
            const ot = (D.ot || '').trim(),
                n = (t, x) => x?.trim() ? [{
                    id: uid(),
                    tipo: t,
                    texto: x.trim(),
                    autor: autor(),
                    fechaISO: now()
                }] : [];
            const pe = personas().find(p => p.id == D.ing) || personas().find(p => p.nombre == autor()),
                j = {
                    v: 1,
                    id: uid(),
                    ot,
                    ingresadoPor: {
                        id: pe?.id || '',
                        nombre: pe?.nombre || autor()
                    },
                    titulo: '',
                    estado: 'cola',
                    prioridad: D.prio || 'normal',
                    plataformaId: D.plat,
                    mecanicoId: D.mec || '',
                    vehiculo: {
                        patente: (D.patente || '').toUpperCase(),
                        patenteN: pat,
                        marca: D.marca || '',
                        modelo: D.modelo || '',
                        version: D.version || '',
                        motor: D.motor || '',
                        combustible: D.comb || '',
                        km: +D.km || 0
                    },
                    cliente: {
                        nombre: D.nombre || '',
                        telefono: D.tel || ''
                    },
                    servicios: sv,
                    repuestos: D.rep,
                    opciones: {
                        espera: !!D.espera,
                        entregaISO: D.entrega ? (() => {
                            const [h, m] = D.entrega.split(':'),
                                d = new Date();
                            d.setHours(+h, +m, 0, 0);
                            return d.toISOString()
                        })() : '',
                        vin: (D.vin || '').trim().toUpperCase(),
                        nivelComb: D.nivel || ''
                    },
                    tiempos: {
                        ingresoISO: ingISO(D.ingreso),
                        estSeg: +D.estMin > 0 ? Math.round(+D.estMin * 60) : sv.reduce((a, s) => a + s.estSeg, 0),
                        acumSeg: 0,
                        ultimoInicioISO: null,
                        completadoISO: null,
                        realSeg: 0,
                        desvSeg: 0
                    },
                    pausa: null,
                    notas: [...n('orden', D.notaO), ...n('vehiculo', D.notaV)],
                    alertas: [],
                    eventos: []
                };
            ev(j, 'creado', `OT ${ot}`);
            localStorage.removeItem('lubri_draft');
            D = null;
            S.modal = null;
            mark('flash', j.id, 1300);
            saveJob(j);
            toast('check', 'Nuevo trabajo guardado')
        },
        // --- configuración ---
        cadd: d => {
            const i = $('#n_' + d.k),
                v = i.value.trim();
            if (!v)
                return;
            S.cfg[d.k].push({
                id: d.k == 'motivos' ? slug(v) : uid(),
                nombre: v,
                activo: true,
                ...(d.k == 'plataformas' ? {
                    zonaId: $('#z_plataformas')?.value || S.cfg.zonas[0].id
                } : {})
            });
            saveCfg()
        },
        cact: d => {
            const x = S.cfg[d.k].find(y => y.id == d.id);
            x.activo = !x.activo;
            saveCfg()
        },
        cdel: d => {
            const k = {
                plataformas: 'plataformaId',
                mecanicos: 'mecanicoId'
            }[d.k];
            if (k && S.jobs.some(j => j[k] == d.id))
                return toast('warning', 'Tiene trabajos: desactívalo');
            S.cfg[d.k] = S.cfg[d.k].filter(y => y.id != d.id);
            saveCfg()
        },
        svadd: () => {
            const n = $('#sv_n').value.trim(),
                m = +$('#sv_m').value;
            let g = $('#sv_gs').value;
            if (g == '__new')
                g = $('#sv_g').value.trim();
            if (!n || !m || !g)
                return toast('warning', 'Falta nombre, grupo o minutos');
            let cod = slug(n);
            while (cod == 'OTRO' || S.cfg.catalogo.some(y => y.cod == cod))
                cod += '_' + uid().slice(-3);
            S.cfg.catalogo.push({
                cod,
                nombre: n,
                grupo: g,
                cat: $('#sv_c').value,
                min: m
            });
            saveCfg()
        },
        svdel: d => {
            S.cfg.catalogo.splice(d.i, 1);
            saveCfg()
        },
        rst: () => {
            S.cfg.catalogo = parseCat();
            S.cfg.repuestos = parseRep();
            saveCfg()
        },
        // nunca borra trabajos
        exp: () => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([JSON.stringify({
                config: S.cfg,
                trabajos: S.jobs
            }, null, 1)], {
                type: 'application/json'
            }));
            a.download = 'lubricentro_' + now().slice(0, 10) + '.json';
            a.click()
        }
    };
    document.addEventListener('click', e => {
        const b = e.target.closest('[data-a]');
        if (b) {
            if (b.tagName == 'BUTTON')
                navigator.vibrate?.(8);
            A[b.dataset.a]?.(b.dataset, b, e)
        }
    });
    document.addEventListener('change', e => {
        const t = e.target,
            k = t.dataset.ch;
        if (!k)
            return;
        if (k == 'pnom') {
            const p = S.cfg.plataformas.find(x => x.id == t.dataset.id);
            if (p && t.value.trim() && p.nombre != t.value.trim()) {
                p.nombre = t.value.trim();
                saveCfg()
            }
            return
        }
        if (k == 'df1' || k == 'df2') {
            S.df[k == 'df1' ? 'd1' : 'd2'] = t.value;
            if (S.df.k != 'rango')
                S.df.k = 'rango';
            render(1);
            return
        }
        if (k == 'pzona') {
            const p = S.cfg.plataformas.find(x => x.id == t.dataset.id);
            if (p) {
                p.zonaId = t.value;
                saveCfg()
            }
            return
        }
        if (k == 'znom') {
            const z = zn(t.dataset.z);
            if (z && t.value.trim()) {
                z.nombre = t.value.trim();
                saveCfg()
            }
            return
        }
        if (k == 'svgs') {
            const i = $('#sv_g');
            i.style.display = t.value == '__new' ? '' : 'none';
            if (t.value == '__new')
                i.focus()
        }
        if (k == 'autor')
            localStorage.lubri_autor = t.value;
        if (k == 'min') {
            S.cfg.catalogo[t.dataset.i].min = +t.value;
            saveCfg()
        }
        if (k == 'avisoMin') {
            S.cfg.avisoMin = Math.max(1, +t.value || 20);
            saveCfg()
        }
        if (k == 'negocio') {
            S.cfg.negocio = t.value;
            saveCfg()
        }
        if (k == 'alertas') {
            S.cfg.alertas = t.checked;
            saveCfg()
        }
        if (k == 'anim') {
            try {
                localStorage.lub_anim = t.checked ? 'on' : 'sys'
            } catch (e) {}
            applyAnim()
        }
        if (k == 'supervision') {
            S.cfg.supervision = t.value.trim();
            saveCfg()
        }
        if (k == 'rc')
            D.rep[t.dataset.i].cant = +t.value || 1;
        if (k == 'rmodo' && S.modal)
            S.modal.modo = t.value;
        if (k == 'rmot' && S.modal)
            S.modal.mot = t.value;
        if (k == 'rmots' && S.modal)
            S.modal.sel = t.value;
        if (k == 'rdt' && S.modal) {
            S.modal.dt = t.value;
            S.modal.modo = 'prog';
            const r = document.querySelector('input[name=rmodo][value=prog]');
            if (r)
                r.checked = true
        }
        if (k == 'veh') {
            const j = get(t.dataset.id),
                f = t.dataset.k,
                x = f == 'km' ? Math.max(0, +t.value || 0) : t.value.trim();
            if (j.vehiculo[f] == x)
                return;
            j.vehiculo[f] = x;
            ev(j, 'vehiculo', f + ': ' + x);
            saveJob(j, 1)
        }
    });
    const fmtPat = s => {
        const t = s.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
        return /^[A-Z]{2}\d/.test(t) ? t.replace(/^(..)(.*)$/, '$1·$2') : t.replace(/(..)(?=.)/g, '$1·')
    }; // AA·BB·11 (nuevas) o AB·1234 (antiguas)
    function autofill(n) {
        // patente conocida → rellena cliente y datos del vehículo desde la última orden
        collect();
        D._ap = n;
        const o = S.jobs.filter(j => j.vehiculo.patenteN == n).sort((a, b) => b.tiempos.ingresoISO.localeCompare(a.tiempos.ingresoISO))[0];
        if (!o)
            return;
        const v = o.vehiculo;
        for (const [k, x] of Object.entries({
            nombre: o.cliente.nombre,
            tel: o.cliente.telefono,
            marca: v.marca,
            modelo: v.modelo,
            version: v.version,
            motor: v.motor,
            comb: v.combustible
        }))
            if (!D[k] && x)
                D[k] = x;
        D._known = 'Vehículo conocido · última visita ' + new Date(o.tiempos.ingresoISO).toLocaleDateString('es-CL') + (v.km ? ' · km anterior ' + (+v.km).toLocaleString('es-CL') : '');
        render(1)
    }
    document.addEventListener('input', e => {
        const t = e.target;
        if (t.classList?.contains('plin')) {
            t.value = fmtPat(t.value);
            const n = t.value.replace(/[^A-Z0-9]/g, '');
            if (n.length == 6 && D && !D._edit && D._ap !== n)
                autofill(n);
            else if (n.length != 6 && D?._known) {
                D._known = '';
                D._ap = null;
                t.closest('div').querySelector('.known')?.remove()
            }
        }
        if (t.id == 'mq') {
            S.ms = t.value;
            const M = mM();
            S.mj = M.some(j => j.id == S.mj) ? S.mj : (M[0]?.id || null);
            S.zp = null;
            const r = $('#mres');
            if (r)
                r.innerHTML = mres();
            const w = $('.mapw');
            if (w)
                w.innerHTML = mapaSvg() + (jpop() || zpop())
        }
        if (t.id == 'q') {
            S.q = t.value;
            $('#lst').innerHTML = S.view == 'linea' ? lista() : listaC()
        }
    });
    document.addEventListener('keydown', e => {
        if ((e.key == 'Enter' || e.key == ' ') && e.target.matches?.('[role=button][data-a]')) {
            e.preventDefault();
            e.target.dispatchEvent(new MouseEvent('click', {
                bubbles: true
            }))
        }
        if (e.key == 'Enter' && e.target.matches('.add input'))
            e.target.closest('.add').querySelector('button')?.click();
        if (e.key == 'Enter' && (e.target.id == 'q' || e.target.id == 'mq'))
            e.target.blur()
    });
    /* ---- Banner de aviso (por vencer / atrasada): 7 s con cuenta regresiva; Cerrar o Posponer ---- */
    const AL = {
        q: [],
        cur: null,
        left: 0,
        last: 0,
        paused: false,
        iv: null,
        DUR: 7000,
        SNZ: 5
    }; // SNZ = minutos de posposición
    function alPush(j, cl) {
        const a = {
            id: j.id,
            cl,
            m: cl == 'atraso' ? Math.max(0, Math.ceil((el(j) - j.tiempos.estSeg) / 60)) : Math.max(1, Math.ceil((j.tiempos.estSeg - el(j)) / 60)),
            d: (j.ot ? 'OT ' + j.ot + ' · ' : '') + j.vehiculo.patente
        };
        AL.q = AL.q.filter(x => x.id !== a.id);
        AL.q.push(a);
        if (!AL.cur)
            alNext();
        else if (AL.cur.id === a.id) {
            AL.q.unshift(AL.q.pop());
            alHide()
        }
    }
    function alNext() {
        clearInterval(AL.iv);
        const a = AL.cur = AL.q.shift(),
            box = document.getElementById('alb');
        if (!a) {
            box.innerHTML = '';
            return
        }
        box.innerHTML = `<div class="alb ${a.cl}" role="alert"><i class="dot ${a.cl == 'atraso' ? 'pausa' : 'cola'}"></i><span class="tx"><b>${a.cl == 'atraso' ? 'Atrasada' + (a.m ? ' · +' + a.m + ' min' : '') : 'Por vencer · quedan ' + a.m + ' min'}</b><span>${esc(a.d)}</span></span><button data-al="p" title="Volver a avisar en ${AL.SNZ} min">Posponer</button><span class="cd"><b id="alc">${AL.DUR / 1000}</b>s</span><button class="xx" data-al="x" title="Cerrar" aria-label="Cerrar">${ic('close')}</button><div class="pb" id="alp"></div></div>`;
        AL.left = AL.DUR;
        AL.last = Date.now();
        AL.paused = false;
        navigator.vibrate?.(40);
        AL.iv = setInterval(() => {
            const t = Date.now(),
                dt = t - AL.last;
            AL.last = t;
            if (!AL.paused)
                AL.left -= dt;
            const c = document.getElementById('alc'),
                p = document.getElementById('alp');
            if (c)
                c.textContent = Math.max(0, Math.ceil(AL.left / 1000));
            if (p)
                p.style.transform = `scaleX(${Math.max(0, AL.left / AL.DUR)})`;
            if (AL.left <= 0)
                alHide()
        }, 100)
    }
    function alHide() {
        clearInterval(AL.iv);
        const e = document.querySelector('#alb .alb');
        if (!e) {
            alNext();
            return
        }
        if (e.classList.contains('out'))
            return;
        e.classList.add('out');
        setTimeout(alNext, 220)
    }
    document.getElementById('alb').addEventListener('click', e => {
        const b = e.target.closest('[data-al]');
        if (!b || !AL.cur)
            return;
        if (b.dataset.al == 'p') {
            (R.snz = R.snz || {})[AL.cur.id] = Date.now() + AL.SNZ * 60000
        }
        alHide()
    });
    document.getElementById('alb').addEventListener('pointerenter', () => AL.paused = true); // con el dedo o el mouse encima, la cuenta se detiene
    document.getElementById('alb').addEventListener('pointerleave', () => {
        AL.paused = false;
        AL.last = Date.now()
    });
    function watch() {
        // avisa UNA vez cuando un trabajo en proceso pasa a "por vencer" o "atrasada"; el banner no interrumpe, así que sale incluso con una ventana abierta
        if (S.cfg.alertas === false || !S.jobs.length)
            return;
        const first = !R.wa;
        R.wa = R.wa || {};
        for (const j of S.jobs) {
            if (j.estado != 'proceso') {
                delete R.wa[j.id];
                if (R.snz)
                    delete R.snz[j.id];
                continue
            }
            const cl = estado(j)[1];
            if (R.wa[j.id] === cl)
                continue;
            R.wa[j.id] = cl;
            if (!first && (cl == 'vencer' || cl == 'atraso') && !(R.snz && R.snz[j.id]))
                alPush(j, cl)
        }
        if (R.snz)
            for (const id in R.snz) {
                if (Date.now() < R.snz[id])
                    continue;
                delete R.snz[id];
                const j = get(id);
                if (j && j.estado == 'proceso') {
                    const cl = estado(j)[1];
                    if (cl == 'vencer' || cl == 'atraso')
                        alPush(j, cl)
                }
            }
        if (S.modal || S.help || document.activeElement?.matches('input,textarea,select'))
            return; // redibujar solo si no se está escribiendo
        const f = !R.w;
        R.w = R.w || {};
        let ch = 0;
        for (const j of S.jobs) {
            if (j.estado != 'proceso') {
                delete R.w[j.id];
                continue
            }
            const cl = estado(j)[1];
            if (R.w[j.id] === cl)
                continue;
            R.w[j.id] = cl;
            ch = 1
        }
        if (ch && !f)
            render()
    }
    setInterval(() => {
        document.querySelectorAll('[data-c]').forEach(n => {
            const j = get(n.dataset.c);
            if (j) {
                n.textContent = clock(el(j));
                const a = estado(j)[1] == 'atraso';
                n.classList.toggle('atraso', a);
                n.classList.toggle('run', a && j.estado == 'proceso')
            }
        });
        document.querySelectorAll('[data-w]').forEach(n => n.textContent = wait(n.dataset.w));
        document.querySelectorAll('[data-greet]').forEach(n => {
            const g = greet();
            if (n.dataset.g !== g) {
                n.dataset.g = g;
                n.innerHTML = greetH()
            }
        });
        document.querySelectorAll('[data-date]').forEach(n => n.textContent = dDate());
        document.querySelectorAll('[data-time]').forEach(n => n.textContent = dTime());
        watch()
    }, 1000); // cronómetro, tiempos de espera y avisos en vivo
    const ANIM_ON = () => {
        try {
            return localStorage.lub_anim !== 'sys'
        } catch (e) {
            return true
        }
    }; // por defecto las animaciones SIEMPRE se muestran
    const _stEl = document.querySelector('style'),
        _css0 = _stEl.textContent;
    function applyAnim() {
        _stEl.textContent = ANIM_ON() ? _css0.replace(/@media\s*\(prefers-reduced-motion:\s*no-preference\)/g, '@media all').replace(/@media\s*\(prefers-reduced-motion:\s*reduce\)/g, '@media not all') : _css0
    }
    applyAnim();
    /* v0.17 · fechas: ingT = hora si es de hoy, o "dd/mm hh:mm" si es otro día (órdenes programadas); dtLocal = valor para <input type=datetime-local> */
    const ingT = iso => hoy(iso) ? hm(iso) : new Date(iso).toLocaleDateString('es-CL', {
            day: '2-digit',
            month: '2-digit'
        }) + ' ' + hm(iso),
        dtLocal = ms => new Date(ms - new Date(ms).getTimezoneOffset() * 6e4).toISOString().slice(0, 16);
    await initDB();
    render(1);
    </script>
</body>
</html>
