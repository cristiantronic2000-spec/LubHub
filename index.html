    <!--
    ===================================================================================
    APP: LÍNEA DE TRABAJO PARA LUBRICENTRO · v0.36 (un solo archivo, sin compilar)
    QUÉ HACE: muestra en tiempo real qué trabajos están en cola, en proceso, en pausa o
    completados, con cronómetro, tiempos estimados, notas y bitácora de eventos.
    MODO DEMO (sin Firebase): carga los datos del prototipo (3 talleres, 8 trabajos);
    se reinician o vacían desde Configuración. Con Firebase la app arranca VACÍA:
    crea primero mecánicos, personal de recepción y talleres en Configuración.

    CAMBIOS v0.36: los autos de calles laterales y los que doblan al taller esperan menos (cuanto más esperan, menor hueco aceptan); menos tráfico de fondo (más tiempo entre autos y menos autos que entran al taller) para evitar tacos; sin alerta de taco: al reiniciarse el mapa (solo o con el botón) las calles parpadean.
    CAMBIOS v0.35: las alertas, avisos y ventanas de pantalla completa se ven bien en el navegador: se corrigió una regla antigua (inset:auto!important) que anulaba left/right y dejaba la ventana encogida y pegada a la izquierda; ahora la sombra cubre todo el ancho y la ventana queda centrada sobre la barra inferior.
    CAMBIOS v0.34: doble toque sobre un auto que no es de una orden de trabajo (autos de fondo) lo desvanece; reaparece más tarde por otra calle. Los vehículos de órdenes no se ven afectados.
    CAMBIOS v0.33: (1) ventanas, alertas y banners ajustados a la pantalla (el banner sigue al área visible, respeta las zonas seguras laterales y nada se sale del ancho); (2) la sombra de la ventana también cubre la barra inferior, pero sus botones se siguen pudiendo presionar; (3) botón Reiniciar mapa (esquina superior izquierda del mapa) y detección automática de tacos: si un vehículo queda detenido demasiado tiempo el mapa se reinicia solo; (4) los autos ya no bajan la velocidad al pasar frente al taller (se quitó la zona lenta aleatoria, ya no frenan por autos que doblan hacia el taller y la calle solo cede cuando una salida lleva esperando más de 2,5 s).
    CAMBIOS v0.32 (puerta del taller, como antes de v0.30 pero con prioridades): orden de prioridad = (1) vehículos que SALEN del taller, (2) vehículos reales que esperan para ir a su zona, (3) autos de fondo que entran/salen, (4) calle principal, que ahora CEDE el paso a quien sale o entra (ya no al revés). El que sale ya no cede a la calle principal ni queda bloqueado por un taco: los autos del carril → se detienen antes de la puerta mientras hay una salida en curso o esperando, y la salida arranca en cuanto la zona de incorporación está despejada. Quien entra desde el carril ← obtiene el paso casi de inmediato.
    CAMBIOS v0.31: los vehículos reales (esperando para ir a su zona, entrar o salir) tienen prioridad sobre los autos de fondo: los de fondo no empiezan a entrar ni a salir mientras un vehículo real espera, y los reales ya no esperan por los de fondo que solo están en fila.
    CAMBIOS v0.30: (1) saludo corregido: de 20:00 a 4:59 dice buenas noches (de 0:00 a 4:59 decía tardes); (2) puerta del taller: el que sale cede el paso a la calle principal y se detiene en la puerta si viene un vehículo, quien va a entrar espera en la línea de detención mientras alguien sale o espera salir, y la salida despeja la puerta antes de que entre el siguiente.
    CAMBIOS v0.29: el taller ya no admite un solo vehículo moviéndose: si el de adelante ya está a distancia segura, el siguiente entra o sale sin esperar (mismo sentido); entrar y salir a la vez sigue siendo exclusivo y cada uno guarda distancia con el de adelante.
    CAMBIOS v0.28 (reúne v0.26, v0.27.1 y v0.27.2): estacionamiento E y plazas por zona con vehículos en vivo (llegan, esperan, pasan a su zona y salen), turno de llegada en la puerta, sin zoom del navegador, ventanas ajustadas al área visible del móvil y Mapa de procesos con mapa grande en recuadro y buscador debajo.
    CAMBIOS v0.27.2: (1) el navegador ya no hace zoom al escribir (viewport sin zoom, campos a 16 px, sin pellizco ni doble toque); (2) ventanas emergentes ajustadas al área visible del móvil (ya no quedan pegadas ni cortadas, botones siempre al alcance); (3) Mapa de procesos: mapa más grande dentro de un recuadro redondeado con el buscador debajo.
    CAMBIOS v0.27.1: (1) los vehículos ya no se teletransportan al cambiar un trabajo con el mapa oculto: se desplazan a su zona o salen del taller en cuanto el mapa se ve (solo la carga inicial se ubica al instante); (2) cola de entrada por orden de llegada: quien llega después a la puerta espera a quien ya estaba (entrando o saliendo).
    CAMBIOS v0.26: Mapa de procesos con estacionamiento (E, 11 plazas: 8+3 como el boceto) y plazas dentro de cada zona (4/4/2/2, editables en Modificar el mapa). Los vehículos reales se ven en vivo: llegan al crearse la orden, esperan en el estacionamiento (plaza blanca 20%), pasan a la plaza de su zona al iniciar y salen al completar. Las plazas vacías admiten autos de fondo que se desocupan si hacen falta. Tocar un vehículo abre su burbuja con los datos básicos.
    CAMBIOS v0.25: (1) barra de menú inferior realmente fija: la página ya no se desplaza, solo el contenido (#app) lo hace dentro del espacio sobre la barra, así no se mueve ni deja ver el fondo; (2) Dashboard: al tocar un trabajo en proceso se abre como ventana sobre el Dashboard; al cerrarla se sigue en el Dashboard, salvo que se edite, pause o elimine (entonces va a Línea de trabajo); (3) ventanas: ocupan el espacio libre sin tapar la barra de menú (también con el teclado abierto), cabecera y botones inferiores fijos y el contenido se desliza entre ellos; se corrigió el orden de capas (el formulario/avisos quedaban detrás de la orden abierta); (4) Mapa de procesos: orden Mapa → Buscador → Resumen → lo demás; al tocar el buscador flota arriba con el mapa visible y la zona del vehículo resaltada; (5) rendimiento: sin desenfoques costosos, simulación de tráfico a 30 fps y pausada cuando no se ve, redibujado sin cambios omitido, cronómetro en pausa con la app oculta.
    CAMBIOS v0.24: (1) intermitentes, luces de freno, balizas y luces altas; (2) puerta y estacionamiento del taller (en el mapa y en la simulación); (3) autos blancos/negros y camiones blancos; (4) ventanas con scroll interno y botones fijos; (5) barra inferior más baja; (6) globos de proceso ajustados al iPhone vertical.
       CAMBIOS v0.23: (1) más flujo por la calle principal (la horizontal) en ambos sentidos; (2) los vehículos de la calle secundaria (la vertical) esperan en la línea de detención y doblan a la derecha hacia la principal cuando hay espacio;
    (3) las entradas al taller se animan desde ambos sentidos de la principal (desde el sentido contrario el auto cruza el carril de enfrente cuando está libre) y el mismo vehículo sale después hacia la derecha; el camión que entra sigue siendo raro.
    CAMBIOS v0.22: (1) Autos más grandes y camiones (3) en las calles; la calle horizontal tiene preferencia en el cruce: los vehículos de la vertical esperan en la línea de detención hasta que haya espacio; todos aparecen y se desvanecen
    exactamente en los límites de las calles; (2) algunos autos y, muy rara vez, un camión (el mismo que sale) entran al taller y vuelven a salir; (3) los vehículos también circulan en el Mapa de procesos; (4) los avisos de atraso / por vencer duran 7 s
    (antes 5 s) si no se cierran a mano.
    CAMBIOS v0.21 (solo Dashboard): (1) sin sombras fijas: el botón "+ Nuevo trabajo" y los botones de pausar/completar solo muestran sombra al presionarlos o pasar el cursor, igual que "Ver en
    línea de trabajo"; el contenido de "+ Nuevo trabajo" quedó centrado; (2) más separación entre el mapa y los globos; (3) el mapa tiene autos muy sutiles que pasan por las calles exteriores en ambos
    sentidos (se respetan los ajustes de animación).
    CAMBIOS v0.20: (1) Dashboard: más espacio entre saludo, mapa y secciones; OT alineada con el punto de estado en cada trabajo en proceso; etiqueta A tiempo / Por vencer / Atrasado
    (pequeña, sin animación) en la esquina inferior derecha; más aire sobre y bajo la barra inferior; (2) avisos de "por vencer" y "atrasada" más grandes, con fondo blanco sólido; "por vencer" llega
    20 min antes del vencimiento (parámetro "minutos de aviso" en Configuración; en órdenes cortas, como máximo la mitad del estimado) y la etiqueta Por vencer usa la misma regla; (3) Mapa de procesos:
    buscador por patente, OT o cliente bajo el resumen; la burbuja del mapa muestra el proceso encontrado y su botón abre ese proceso.
    CAMBIOS v0.19: (1) Dashboard: cabecera como el boceto (saludo en 2 líneas a la izquierda, fecha y hora a la derecha), mapa recortado sin espacios sobrantes, globos tan altos como el mapa,
    botón "+ Nuevo trabajo" (negro) bajo "Ver en línea de trabajo", cada trabajo en proceso muestra sub-zona y debajo la zona; (2) los indicadores de color (puntos) dejan de animarse cuando su
    conteo es 0, igual que en pausa; (3) KPI con más datos (ingresadas, espera en cola, pausas, reaperturas, urgentes, completadas por día, por mecánico, motivos de pausa) y nueva sección
    separada "Trabajos más solicitados" (tipo, cantidad y recurrencia, más vehículos recurrentes); (4) barra inferior de fondo sólido y con más aire bajo el texto (iPhone).
    CAMBIOS v0.18: (1) NUEVA pantalla principal "Dashboard" (saludo según la hora, fecha y hora en vivo, mapa solo con el número de trabajos por zona, globos con el resumen del día,
    trabajos en proceso ahora, talleres activos y KPI); el antiguo menú de inicio pasó a ser una barra inferior fija (Dashboard, Línea de trabajo, Mapa de procesos, Órdenes completas,
    Configuración); (2) toda orden reabierta muestra siempre el recuadro "Orden reactivada · fecha" con el motivo debajo (lista y detalle), se actualiza si se reabre otra vez y se
    conserva al volver a completarla (sale de la bitácora); (3) las notas del detalle ya no se cortan: el recuadro crece para mostrarlas completas; (4) Órdenes completas: filtros
    rápidos de fecha Hoy / Ayer / Semana pasada y Fechas… (un día o un rango).
    CAMBIOS v0.17: (1) Configuración: los bloques se pliegan (título + subtítulo) y se expanden al tocarlos; "Quién usa este equipo" y
    "Conexión y datos" quedan siempre visibles; (2) volver al taller una orden completada: motivo elegible de una lista de motivos frecuentes
    (editable en Configuración > Motivos de reapertura, con "Otro" para escribir) y nueva opción "hora personalizada" (fecha y hora) que deja la
    orden pre-programada en cola hasta esa fecha.
    CAMBIOS v0.16: (1) inicio: el número de Línea de trabajo es verde sin pausas y rojo con 1 o más en pausa; (2) etiquetas de tiempo de las
    órdenes completadas sin animación (siguen mostrando A tiempo / Atrasado); (3) botón "volver al taller" de una orden completada: pide confirmar,
    elegir hora de ingreso (original o nueva desde ahora) y el motivo; (4) íconos de avisos con animación de "crecer y volver" (eliminar más brusca,
    crear más suave, otros intermedia); (5) filas de la Línea de trabajo con mejor espaciado y patentes más grandes; (6) botones laterales con el mismo
    alto del globo (1 o 2 botones); (7) mapa: el borde blanco del indicador de cada zona parpadea si hay trabajos activos y no si hay 0;
    (8) nuevo trabajo: si la hora de ingreso queda vacía se usa la hora en que se confirma la creación (ahora explícito en el formulario).
    CAMBIOS v0.15: (1) el punto de "En pausa" vuelve a parpadear siempre; solo queda quieto y apagado cuando no hay pausas contabilizadas (0);
    (2) Órdenes completas: al elegir una zona aparece debajo una 2ª fila para filtrar por sub-zona (los nombres salen de Configuración,
    si se renombra una sub-zona el filtro cambia solo); (3) la palabra "plataforma" se unificó a "sub-zona" en los textos visibles.
    CAMBIOS v0.14: la ayuda ahora es contextual (solo muestra las funciones de la pantalla donde se presiona).
    CAMBIOS v0.13: etiquetas A tiempo/Por vencer/Atrasado con alto y ancho fijos y una sola fila en toda la app
    (se quitó la animación que cambiaba su ancho); espaciados y márgenes aumentados en todas las pantallas;
    ayuda reescrita con las funciones de cada sección.

    INSTALACIÓN
    1) GitHub: sube este archivo como index.html → Settings > Pages > rama main.
    2) Firebase: console.firebase.google.com → proyecto → Firestore Database → crear.
       Registra una app web, copia su config en FIREBASE_CONFIG (más abajo).
       Reglas de prueba (SOLO para empezar; luego agrega Firebase Auth):
       rules_version='2'; service cloud.firestore{match /databases/{d}/documents{
       match /{doc=**}{allow read,write: if true;}}}
    3) Sin config de Firebase = MODO DEMO: datos en este navegador (localStorage).

    DICCIONARIO DE DATOS (pensado para que una IA lo lea sin ambigüedad)
    Fechas: ISO 8601 (UTC). Duraciones: SEGUNDOS. Valores cerrados sin tildes.
    trabajos/{id}:
      v: versión del esquema (1) · ot: n° orden (vacío = "SOT", sin orden de trabajo)
      prioridad: normal|urgente · titulo: resumen opcional del trabajo
      ingresadoPor{id,nombre}: persona de recepción que registró la orden
      estado: cola|proceso|pausa|completado
      plataformaId, mecanicoId: ids de config/principal
      vehiculo{patente, patenteN (sin guiones/puntos, mayúsculas), marca, modelo,
               version, motor, combustible, km}
      cliente{nombre, telefono}
      opciones{espera(bool: cliente espera en el local), entregaISO(hora prometida), vin, nivelComb}
      servicios[{cod, nombre, grupo, cat:cambiar|revisar, estSeg, hecho}]
      repuestos[{grupo, nombre, cant}]
      tiempos{ingresoISO, estSeg, acumSeg, ultimoInicioISO, completadoISO, realSeg, desvSeg}
         (tiempo corriendo = acumSeg + ahora - ultimoInicioISO si estado=proceso;
          desvSeg = realSeg - estSeg; positivo = atrasado)
      pausa{motivo(id), desdeISO} | null
      notas[{id, tipo:orden|vehiculo, texto, autor, fechaISO}]
      alertas[{id, tipo:revision, texto, estado:abierta|resuelta, fechaISO}]
      eventos[{tipo, detalle, autor, fechaISO}]  ← BITÁCORA (nunca se borra)
         tipos: creado|iniciado|pausado|reanudado|completado|reabierto|nota|servicio|repuesto|alerta|vehiculo|editado
    config/principal: zonas[{id,nombre,activo,x,y,w,h}] (plano del taller, coordenadas 0-100 x 0-154), plataformas[{id,nombre,activo,zonaId}] (sub-zonas de cada zona), mecanicos[], motivos[] ({id,nombre,activo}), motivosReab[] ({id,nombre,activo}: motivos frecuentes al reabrir una orden),
      catalogo[{cod,nombre,grupo,cat,min}], repuestos[{grupo,nombre}], umbral, negocio, supervision (WhatsApp de supervisión), alertas (bool: avisos automáticos)
    ===================================================================================

    @media (prefers-reduced-motion: no-preference) {
        @keyframes fade {
            from {
                opacity:0
            }

            to {
                opacity: 1
            }
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform:translateY(18px) scale(.94)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @keyframes icopop {
            0% {
                transform: scale(.3) rotate(-14deg);
                opacity:0
            }

            60% {
                transform: scale(1.2) rotate(4deg);
                opacity:1
            }

            100% {
                transform: none
            }
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform:translateY(-8px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @keyframes view {
            from {
                opacity: 0;
                transform:translateX(14px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @keyframes ring {
            0% {
                box-shadow:0 0 0 0 rgba(242, 106, 33, .6)
            }

            70% {
                box-shadow:0 0 0 9px rgba(242, 106, 33, 0)
            }

            100% {
                box-shadow: 0 0 0 0 rgba(242, 106, 33, 0)
            }
        }

        @keyframes ringr {
            0% {
                box-shadow:0 0 0 0 rgba(225, 29, 29, .55)
            }

            70% {
                box-shadow:0 0 0 8px rgba(225, 29, 29, 0)
            }

            100% {
                box-shadow: 0 0 0 0 rgba(225, 29, 29, 0)
            }
        }

        @keyframes blink {
            50% {
                opacity: .35
            }
        }

        @keyframes shake {
            20%, 60% {
                transform:translateX(-7px)
            }

            40%, 80% {
                transform: translateX(7px)
            }
        }

        .bd.in {
            animation: fade .18s ease-out
        }

        .bd.in .box {
            animation: pop .26s cubic-bezier(.2, .9, .3, 1.15)
        }

        .bd.in .big {
            animation: icopop .45s .08s cubic-bezier(.2, .9, .3, 1.3) both
        }

        .bd.in .box.warn {
            animation: pop .26s ease-out, shake .4s .26s
        }

        .enter {
            animation: rise .22s ease-out
        }

        #app.vw {
            animation: view .24s ease-out
        }

        .dot.proceso {
            animation:ring 1.8s infinite
        }

        .dot.pausa {
            animation: ringr 2.4s infinite
        }

        .al .material-symbols-outlined {
            animation: blink 1.4s infinite
        }

        .material-symbols-outlined {
            transition:transform .15s
        }

        button:hover .material-symbols-outlined {
            transform: scale(1.12)
        }

        .chip {
            transition: background-color .15s, color .15s, border-color .15s
        }

        /* punto de color: cada estado parpadea a su manera */
        @keyframes dcola {
            0%, 100% {
                opacity: 1;
                box-shadow:0 0 0 0 rgba(245, 192, 0, .65)
            }

            50% {
                opacity: .35;
                box-shadow: 0 0 0 var(--sp) rgba(245, 192, 0, 0)
            }
        }

                transform: scale(1);
                box-shadow:0 0 0 0 rgba(242, 106, 33, .75)
            }

            50% {
                transform:scale(1.28)
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 0 var(--sp) rgba(242, 106, 33, 0)
            }
        }

        @keyframes dpau {
            0% {
                opacity: 1;
                box-shadow:0 0 0 0 rgba(225, 29, 29, .6)
            }

            8% {
                opacity:.1
            }

            16% {
                opacity:1
            }

            24% {
                opacity:.1
            }

            32% {
                opacity:1
            }

            60% {
                box-shadow:0 0 0 var(--sp) rgba(225, 29, 29, 0)
            }

            100% {
                opacity: 1;
                box-shadow: 0 0 0 0 rgba(225, 29, 29, 0)
            }
        }

        @keyframes dcomp {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(46, 179, 74, 0);
                transform:scale(1)
            }

            50% {
                box-shadow: 0 0 0 var(--sp) rgba(46, 179, 74, .28);
                transform: scale(1.12)
            }
        }

            animation: dcola 2.6s ease-in-out infinite
        }

        .dot.proceso {
            animation: dproc 1.1s ease-out infinite
        }

        .dot.pausa {
            animation: dpau 1.8s ease-in-out infinite
        }

        .dot.completado {
            animation: dcomp 3.4s ease-in-out infinite
        }/* etiquetas A tiempo / Por vencer / Atrasado: color + parpadeo propio */

        @keyframes tgok {
            0%, 100% {
                opacity: 1;
                box-shadow:0 0 0 0 rgba(46, 179, 74, 0)
            }

            50% {
                opacity: .62;
                box-shadow: 0 0 0 5px rgba(46, 179, 74, .22)

        }

                opacity:1
            }

            50%, 100% {
                opacity: .3
            }
        }

            }

        }

        .tg.vencer {
            animation: tgven 1.1s linear infinite
        }

        .tg.atraso {
            animation: tgat .6s ease-in-out infinite
        }/* completadas hoy: entran y se pliegan solas */

        @keyframes slideIn {
            from {

                transform:translateY(-12px) scale(.96)
            }

            }

        .slide {

        }

    }/* ---- v0.7: mapa de procesos, zonas y cronómetro sin color ---- */

    const CAT_BASE = "Lubricación=ACEITE_MOTOR:Aceite motor:45,ACEITE_CAJA:Aceite caja:60,ACEITE_DIFERENCIAL:Aceite diferencial:40,ENGRASE:Engrase general:20,?NIVELES:Revisión de niveles:15;Filtros=FILTRO_ACEITE:Filtro aceite:10,FILTRO_AIRE:Filtro aire motor:10,FILTRO_COMBUSTIBLE:Filtro combustible:20,FILTRO_POLEN:Filtro polen:10,?FILTROS_REVISION:Inspección de filtros:10;Frenos=FRENO_PASTILLAS:Pastillas:60,FRENO_DISCOS:Discos:90,FRENO_RECTIFICACION:Rectificación discos:60,FRENO_BANDAS:Bandas/balatas:60,FRENO_LIQUIDO:Líquido de frenos:40,?FRENO_REVISION:Inspección frenos:20;Neumáticos=ALINEACION:Alineación:45,BALANCEO:Balanceo:30,ROTACION:Rotación neumáticos:25,MONTAJE:Montaje neumático:30,?NEUM_REVISION:Revisión presión y desgaste:15;Suspensión=AMORTIGUADORES:Amortiguadores:120,ROTULAS:Rótulas/terminales:90,?TREN_DELANTERO:Revisión tren delantero:30;Motor=BUJIAS:Bujías:40,CORREA_DIST:Correa distribución:240,INYECTORES:Limpieza inyectores:60,RECT_MOTOR:Rectificación motor:480,?MOTOR_REVISION:Revisión de motor:30;Refrigeración=REFRIGERANTE:Refrigerante:45,TERMOSTATO:Termostato:60,?REFRIG_REVISION:Revisión de refrigeración:20;Eléctrico=BATERIA:Batería:20,AMPOLLETAS:Ampolletas:15,?ALTERNADOR:Revisión alternador:30;Diagnóstico=?ESCANER:Escáner:30,?PRE_VIAJE:Revisión pre-viaje:40;Climatización=AC_RECARGA:Recarga A/C:60,?AC_REVISION:Revisión A/C:20";

         <div class="zpad"><span class="sm">Mover</span>${st('arrow_back', 'Izquierda', 'zmv', 'data-dx="-2" data-dy="0"')}${st('arrow_upward', 'Arriba', 'zmv', 'data-dx="0" data-dy="-2"')}${st('arrow_downward', 'Abajo', 'zmv', 'data-dx="0" data-dy="2"')}${st('arrow_forward', 'Derecha', 'zmv', 'data-dx="2" data-dy="0"')}</div>

         <div class="zpad"><span class="sm">Plazas</span>${st('remove', 'Menos plazas', 'zpl', 'data-d="-1"')}<b>${s.pl ?? 0}</b>${st('add', 'Más plazas', 'zpl', 'data-d="1"')}</div>
         <div class="zpad"><span class="sm" style="flex:1">${S.cfg.plataformas.filter(p => p.zonaId == s.id).length} sub-zonas</span>${st(s.activo === false ? 'visibility_off' : 'visibility', 'Mostrar u ocultar en el mapa', 'zact', '')}${st('delete', 'Eliminar zona', 'zdel', '')}</div></div>
         <div class="add"><input id="zn_new" placeholder="Nueva zona"><button data-a="zadd" title="Agregar zona">${ic('add')}</button></div><div class="btns" style="margin-top:12px"><button data-a="cerrar">Listo</button></div></div></div>`
    }
    function kpiRaw(zid) {
        // KPI del taller completo (una fila por zona) o de una zona (una fila por plataforma); con periodo, anillo de puntualidad y servicios más hechos
        const all = !zid,
            z = all ? null : zn(zid),
            ps = S.cfg.plataformas.filter(p => all || p.zonaId == z.id),
            ids = ps.map(p => p.id),
            P = S.kpp || 'todo',
            dias = {
                '7': 7,
                '30': 30
            },
            inP = j => P == 'todo' || (P == 'hoy' ? hoy(j.tiempos.completadoISO) : Date.parse(j.tiempos.completadoISO) >= Date.now() - dias[P] * 864e5),
            C = S.jobs.filter(j => j.estado == 'completado' && ids.includes(j.plataformaId) && inP(j)),
            act = S.jobs.filter(j => j.estado != 'completado' && ids.includes(j.plataformaId)),
            n = C.length,
            av = (L, f) => L.length ? Math.round(L.reduce((a, j) => a + f(j), 0) / L.length / 60) : 0,
            sg = v => (v > 0 ? '+' : '') + v + ' min',
            okF = L => L.filter(j => j.tiempos.desvSeg <= 0).length,
            pc = L => L.length ? Math.round(okF(L) / L.length * 100) : null,
            pct = pc(C),
            col = pct == null ? '#bbb' : pct >= 80 ? 'var(--completado)' : pct >= 60 ? 'var(--cola)' : 'var(--pausa)',
            R0 = 26,
            CI = 2 * Math.PI * R0,
            off = CI * (1 - (pct || 0) / 100),
            dv = n ? av(C, j => j.tiempos.desvSeg) : 0,
            late = act.filter(j => j.estado == 'proceso' && estado(j)[1] == 'atraso').length,
            tile = (i, v, l, t='') => `<div class="kp ${t}">${ic(i)}<b>${v}</b><small>${l}</small></div>`,
            rows = (all ? S.cfg.zonas.map(z => [z.nombre, C.filter(j => zof(j) == z.id)]) : ps.map(p => [p.nombre, C.filter(j => j.plataformaId == p.id)])).filter(r => r[1].length || all),
            sv = {};
        C.forEach(j => j.servicios.forEach(s => {
            if (s.hecho !== false)
                sv[s.nombre] = (sv[s.nombre] || 0) + 1
        }));
        const top = Object.entries(sv).sort((a, b) => b[1] - a[1]).slice(0, 3),
            mx = top.length ? top[0][1] : 1,
            per = [['hoy', 'Hoy'], ['7', '7 días'], ['30', '30 días'], ['todo', 'Todo']];
        const inT = iso => P == 'todo' || (P == 'hoy' ? hoy(iso) : Date.parse(iso) >= Date.now() - dias[P] * 864e5),
            JJ = S.jobs.filter(j => ids.includes(j.plataformaId)),
            evs = t => JJ.flatMap(j => (j.eventos || []).filter(e => e.tipo == t && inT(e.fechaISO))),
            ing = JJ.filter(j => inT(j.tiempos.ingresoISO)),
            pau = evs('pausado'),
            rea = evs('reabierto'),
            wl = C.map(j => {
                const e = (j.eventos || []).find(x => x.tipo == 'iniciado');
                return e ? (Date.parse(e.fechaISO) - Date.parse(j.tiempos.ingresoISO)) / 6e4 : null
            }).filter(x => x != null && x >= 0),
            wavg = wl.length ? Math.round(wl.reduce((a, b) => a + b, 0) / wl.length) : null,
            urg = ing.filter(j => j.prioridad == 'urgente').length,
            spanD = P == 'hoy' ? 1 : P == 'todo' ? Math.max(1, Math.ceil((Date.now() - Math.min(Date.now(), ...C.map(j => Date.parse(j.tiempos.completadoISO)))) / 864e5)) : dias[P],
            pm = {},
            mec = {};
        pau.forEach(e => {
            const k = nm(S.cfg.motivos, e.detalle),
                b = k == '—' ? (e.detalle || 'Sin motivo') : k;
            pm[b] = (pm[b] || 0) + 1
        });
        C.forEach(j => {
            const k = nm(S.cfg.mecanicos, j.mecanicoId),
                b = k == '—' ? 'Sin asignar' : k;
            (mec[b] = mec[b] || []).push(j)
        });
        const pmT = Object.entries(pm).sort((a, b) => b[1] - a[1]).slice(0, 5),
            pmx = pmT.length ? pmT[0][1] : 1,
            mecR = Object.entries(mec).sort((a, b) => b[1].length - a[1].length);
        return `<div class="bd" data-a="cerrar"><div class="box kpb"><div class="kph">${ic('query_stats')}<div><b style="font-size:18px">KPI · ${all ? 'Taller completo' : esc(z.nombre)}</b><div class="sm">Órdenes completadas${all ? ' en todo el taller' : ' en esta zona'}</div></div></div>
         <div class="chips kpf">${per.map(([k, t]) => `<button class="chip ${P == k ? 'sel' : ''}" data-a="kpp" data-p="${k}">${t}</button>`).join('')}</div>
         <div class="kpm"><svg viewBox="0 0 64 64" class="kpr" role="img" aria-label="Puntualidad"><circle cx="32" cy="32" r="${R0}" fill="none" stroke="#ececec" stroke-width="7"/><circle class="rg" cx="32" cy="32" r="${R0}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${CI.toFixed(1)}" style="stroke-dashoffset:${off.toFixed(1)}" transform="rotate(-90 32 32)"/><text x="32" y="32" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#111">${pct == null ? '—' : pct + '%'}</text></svg>
         <div class="kpt"><b>Puntualidad</b><span class="sm">${n ? `${okF(C)} de ${n} órdenes terminaron dentro del estimado` : 'Aún no hay órdenes completadas en este periodo'}</span>
         <div class="kpc"><span class="${act.some(j => j.estado == 'proceso') ? '' : 'z0'}"><i class="dot proceso"></i>${act.filter(j => j.estado == 'proceso').length}</span><span class="${act.some(j => j.estado == 'cola') ? '' : 'z0'}"><i class="dot cola"></i>${act.filter(j => j.estado == 'cola').length}</span><span class="${act.some(j => j.estado == 'pausa') ? '' : 'z0'}"><i class="dot pausa"></i>${act.filter(j => j.estado == 'pausa').length}</span>${late ? `<span class="kpl">${late} atrasada${late > 1 ? 's' : ''}</span>` : ''}<span class="sm">ahora</span></div></div></div>
         <div class="kpg">${tile('task_alt', n, 'Completadas')}${tile('today', S.jobs.filter(j => j.estado == 'completado' && ids.includes(j.plataformaId) && hoy(j.tiempos.completadoISO)).length, 'Hoy')}${tile('timer', n ? av(C, j => j.tiempos.realSeg) + ' min' : '—', 'Real promedio')}${tile('schedule', n ? av(C, j => j.tiempos.estSeg) + ' min' : '—', 'Estimado prom.')}${tile(dv > 0 ? 'trending_up' : 'trending_down', n ? sg(dv) : '—', 'Desviación', !n ? '' : dv > 0 ? 'bad' : 'good')}${tile('percent', n && av(C, j => j.tiempos.estSeg) ? Math.round(av(C, j => j.tiempos.realSeg) / av(C, j => j.tiempos.estSeg) * 100) + '%' : '—', 'Real vs estimado')}${tile('login', ing.length, 'Ingresadas')}${tile('speed', n ? (n / spanD).toFixed(1).replace('.', ',') : '—', 'Completadas por día')}${tile('hourglass_top', wavg == null ? '—' : wavg + ' min', 'Espera en cola')}${tile('pause_circle', pau.length, 'Pausas')}${tile('replay', rea.length, 'Reaperturas', rea.length ? 'bad' : '')}${tile('priority_high', urg, 'Urgentes')}</div>
         ${rows.length ? `<div class="sec">${ic(all ? 'location_on' : 'garage')} ${all ? 'Por zona' : 'Por sub-zona'}</div>${rows.map(([nb, L]) => {const q = pc(L),d = L.length ? av(L, j => j.tiempos.desvSeg) : 0;return `<div class="kr"><div class="t"><span>${esc(nb)}</span><span class="mut">${L.length} compl.${L.length ? ` · <b class="${d > 0 ? 'kb' : 'kg'}">${sg(d)}</b>` : ''}</span></div><div class="bar2"><i style="width:${q == null ? 0 : q}%;background:${q == null ? '#ddd' : q >= 80 ? 'var(--completado)' : q >= 60 ? 'var(--cola)' : 'var(--pausa)'}"></i></div><div class="sm">${q == null ? 'Sin datos' : q + '% a tiempo'}</div></div>`}).join('')}` : ''}
         ${top.length ? `<div class="sec">${ic('build')} Servicios más hechos</div>${top.map(([nb, k]) => `<div class="kr"><div class="t"><span>${esc(nb)}</span><span class="mut">${k}</span></div><div class="bar2"><i style="width:${Math.round(k / mx * 100)}%;background:var(--ink)"></i></div></div>`).join('')}` : ''}
         ${mecR.length ? `<div class="sec">${ic('engineering')} Por mecánico</div>${mecR.map(([nb, L]) => {const q = pc(L),d = av(L, j => j.tiempos.desvSeg);return `<div class="kr"><div class="t"><span>${esc(nb)}</span><span class="mut">${L.length} compl. · <b class="${d > 0 ? 'kb' : 'kg'}">${sg(d)}</b></span></div><div class="bar2"><i style="width:${q}%;background:${q >= 80 ? 'var(--completado)' : q >= 60 ? 'var(--cola)' : 'var(--pausa)'}"></i></div><div class="sm">${q}% a tiempo · real prom. ${av(L, j => j.tiempos.realSeg)} min</div></div>`}).join('')}` : ''}
         ${pmT.length ? `<div class="sec">${ic('pause_circle')} Motivos de pausa</div>${pmT.map(([nb, k]) => `<div class="kr"><div class="t"><span>${esc(nb)}</span><span class="mut">${k}</span></div><div class="bar2"><i style="width:${Math.round(k / pmx * 100)}%;background:var(--pausa)"></i></div></div>`).join('')}` : ''}
         <div class="btns" style="margin-top:18px"><button data-a="cerrar">Cerrar</button></div></div></div>`
    }

    /* v0.19 · KPI de trabajos más solicitados: tipo (grupo) y servicio, cantidad de órdenes y recurrencia ("1 cada X"); más vehículos que vuelven */
    function kpiTop() {
        const P = S.tpp || '30',
            dias = {
                '7': 7,
                '30': 30
            },
            t0 = new Date().setHours(0, 0, 0, 0),
            inT = iso => P == 'todo' || (P == 'hoy' ? hoy(iso) : Date.parse(iso) >= Date.now() - dias[P] * 864e5),
            J = S.jobs.filter(j => inT(j.tiempos.ingresoISO)),
            span = P == 'hoy' ? Math.max(1 / 24, (Date.now() - t0) / 864e5) : P == 'todo' ? Math.max(1, (Date.now() - Math.min(Date.now(), ...S.jobs.map(j => Date.parse(j.tiempos.ingresoISO)))) / 864e5) : dias[P],
            ev = n => {
                const d = span / n;
                return d >= 1 ? '1 cada ' + (Math.round(d * 10) / 10).toString().replace('.', ',') + ' días' : '1 cada ' + Math.max(1, Math.round(d * 24)) + ' h'
            },
            by = f => {
                const m = {};
                J.forEach(j => new Set(j.servicios.map(f)).forEach(k => m[k] = (m[k] || 0) + 1));
                return Object.entries(m).sort((a, b) => b[1] - a[1])
            },
            row = ([nb, k], mx) => `<div class="kr"><div class="t"><span>${esc(nb)}</span><span class="mut"><b>${k}</b> ${k == 1 ? 'orden' : 'órdenes'} · ${Math.round(k / J.length * 100)}%</span></div><div class="bar2"><i style="width:${Math.round(k / mx * 100)}%;background:var(--ink)"></i></div><div class="sm">${ic('autorenew')} Recurrencia: ${ev(k)}</div></div>`,
            G = by(s => s.grupo || 'Otros'),
            V = by(s => s.nombre).slice(0, 8),
            veh = {};
        J.forEach(j => {
            const k = j.vehiculo.patenteN || j.vehiculo.patente;
            (veh[k] = veh[k] || []).push(j)
        });
        const VR = Object.values(veh).filter(L => L.length > 1).sort((a, b) => b.length - a.length).slice(0, 5);
        return `<div class="kpin"><div class="chips kpf">${[['hoy', 'Hoy'], ['7', '7 días'], ['30', '30 días'], ['todo', 'Todo']].map(([k, t]) => `<button class="chip ${P == k ? 'sel' : ''}" data-a="tpp" data-p="${k}">${t}</button>`).join('')}</div>
         ${J.length ? `<div class="sm">${J.length} ${J.length == 1 ? 'orden ingresada' : 'órdenes ingresadas'} en el periodo</div><div class="sec">${ic('category')} Por tipo de trabajo</div>${G.map(r => row(r, G[0][1])).join('')}<div class="sec">${ic('build')} Servicios más pedidos</div>${V.map(r => row(r, V[0][1])).join('')}${VR.length ? `<div class="sec">${ic('directions_car')} Vehículos recurrentes</div>${VR.map(L => `<div class="kr"><div class="t"><span>${plate(L[0].vehiculo.patente, 's')}</span><span class="mut"><b>${L.length}</b> visitas · última ${fdt(L.map(j => j.tiempos.ingresoISO).sort().pop())}</span></div></div>`).join('')}` : ''}` : '<div class="mut" style="margin-top:8px">Sin órdenes ingresadas en este periodo.</div>'}</div>`
    }

    const kpi = (zid, inl) => {
        const h = kpiRaw(zid);
        return inl ? h.replace('<div class="bd" data-a="cerrar"><div class="box kpb">', '<div class="kpb kpin">').replace('<div class="btns" style="margin-top:18px"><button data-a="cerrar">Cerrar</button></div></div></div>', '</div>') : h
    }; // inl = dentro del Dashboard
    const lstP = () => `${acc('plat', 'Zonas y sub-zonas', 'Sub-zonas de cada zona y mapa del taller', `<div class="note">Cada sub-zona (puesto de trabajo o plataforma) pertenece a una zona del mapa del taller. Si cambias su nombre, se actualiza en toda la app.</div><div style="margin:8px 0"><button class="wide" data-a="mapaed">${ic('map')} Modificar el mapa de taller</button></div>${S.cfg.plataformas.map(x => `<div class="li"><input class="${x.activo ? '' : 'mut'}" data-ch="pnom" data-id="${x.id}" value="${esc(x.nombre)}" aria-label="Nombre"><select data-ch="pzona" data-id="${x.id}" aria-label="Zona">${zopts(x.zonaId)}</select><button data-a="cact" data-k="plataformas" data-id="${x.id}" title="Activar/desactivar">${ic(x.activo ? 'visibility' : 'visibility_off')}</button><button data-a="cdel" data-k="plataformas" data-id="${x.id}" title="Eliminar">${ic('delete')}</button></div>`).join('')}<div class="add"><input id="n_plataformas" placeholder="Nueva sub-zona"><select id="z_plataformas" aria-label="Zona">${zopts()}</select><button data-a="cadd" data-k="plataformas" title="Agregar">${ic('add')}</button></div>`)}`;

    async function initDB() {
        if (FIREBASE_CONFIG.apiKey) {
            try {
                const B = 'https://www.gstatic.com/firebasejs/10.12.2/',
                    a = await import(B + 'firebase-app.js'),
                    f = await import(B + 'firebase-firestore.js');
                const db = f.getFirestore(a.initializeApp(FIREBASE_CONFIG));
                fb = {
                    f,
                    db
                };
                f.onSnapshot(f.collection(db, 'trabajos'), s => {
                    S.jobs = s.docs.map(d => d.data());
                    render()
                }); // tiempo real
                f.onSnapshot(f.doc(db, 'config', 'principal'), d => {
                    if (d.exists())
                        S.cfg = {
                            ...defCfg(),
                            ...d.data()
                        };
                    render()
                });
                return
            }
            catch (e) {
                console.error('Firebase falló, uso modo demo', e)
            }
        }
        if (!localStorage.lubri_ok)
            seed(); // primera vez en demo: datos del prototipo
        else {
            S.jobs = JSON.parse(localStorage.lubri_jobs || '[]');
            if (localStorage.lubri_cfg)
                S.cfg = {
                    ...defCfg(),
                    ...JSON.parse(localStorage.lubri_cfg)
                }
        }
    }
    function saveJob(j, q) {
        // crea o actualiza un trabajo
        if (fb)
            fb.f.setDoc(fb.f.doc(fb.db, 'trabajos', j.id), j);
        else {
            const i = S.jobs.findIndex(x => x.id == j.id);
            i < 0 ? S.jobs.push(j) : S.jobs[i] = j;
            localStorage.lubri_jobs = JSON.stringify(S.jobs)
        }
        if (!q)
            render(1)
    }
    function delJob(id) {
        if (fb)
            fb.f.deleteDoc(fb.f.doc(fb.db, 'trabajos', id));
        else {
            S.jobs = S.jobs.filter(j => j.id != id);
            localStorage.lubri_jobs = JSON.stringify(S.jobs)
        }
        render(1)
    }
    function saveCfg() {
        if (fb)
            fb.f.setDoc(fb.f.doc(fb.db, 'config', 'principal'), S.cfg);

    /* ============ 5. REGLAS DE NEGOCIO ============ */
    const el = j => j.tiempos.acumSeg + (j.estado == 'proceso' && j.tiempos.ultimoInicioISO ? (Date.now() - Date.parse(j.tiempos.ultimoInicioISO)) / 1000 : 0); // segundos transcurridos
    const ev = (j, tipo, detalle='') => j.eventos.push({
        tipo,
        detalle,
        autor: autor(),
        fechaISO: now()
    }); // bitácora
    function estado(j) {
        const e = j.tiempos.estSeg;
        if (!e || j.estado == 'cola')
            return ['', ''];
        if (j.estado == 'completado')
            return el(j) > e ? ['Atrasado', 'atraso'] : ['A tiempo', 'ok'];
        const r = el(j) / e * 100;
        return r >= 100 ? ['Atrasado', 'atraso'] : (e - el(j)) <= Math.min((S.cfg.avisoMin || 20) * 60, e / 2) ? ['Por vencer', 'vencer'] : ['A tiempo', 'ok']
    }
    function mover(id, a, extra) {
        // transiciones: cola→proceso→pausa→proceso→completado
        const j = get(id),
            t = j.tiempos;
        if (a == 'iniciar') {
            if (S.jobs.some(x => x.plataformaId == j.plataformaId && x.estado == 'proceso' && x.id != id))
                return toast('warning', 'Ya hay un trabajo en proceso en esta sub-zona');
            ev(j, j.estado == 'pausa' ? 'reanudado' : 'iniciado');
            j.estado = 'proceso';
            t.ultimoInicioISO = now();
            j.pausa = null
        }
        if (a == 'pausar') {
            t.acumSeg = el(j);
            t.ultimoInicioISO = null;
            j.estado = 'pausa';
            j.pausa = {
                motivo: extra,
                desdeISO: now()
            };
            ev(j, 'pausado', extra)
        }
        if (a == 'completar') {
            t.acumSeg = el(j);
            t.ultimoInicioISO = null;
            t.completadoISO = now();
            t.realSeg = Math.round(t.acumSeg);
            t.desvSeg = t.realSeg - t.estSeg;
            j.estado = 'completado';
            j.pausa = null;
            ev(j, 'completado', `real ${t.realSeg}s / estimado ${t.estSeg}s`);
            if (S.open == id)
                S.open = null;
            showCd(j.plataformaId, 1, 6000)
        }
        if (a == 'reabrir') {
            j.estado = 'pausa';
            t.completadoISO = null;
            j.pausa = {
                motivo: 'REABIERTO',
                desdeISO: now()
            };
            ev(j, 'reabierto')
        }
        mark('flash', id, 1300);
        saveJob(j)
    }

         <div class="cols"><div><h3>${ic('edit_note')} Notas de la orden</h3>${notas(j, 'orden')}</div><div><h3>${ic('directions_car')} Notas del vehículo</h3>${notas(j, 'vehiculo')}</div></div>

         <div><h3>Problemas con la OT</h3><div class="chips" style="flex-wrap:nowrap"><button data-a="alerta" data-id="${j.id}" style="font-size:11px">${ic('fact_check')} Solicitar revisión</button><button data-a="sup" data-id="${j.id}" title="WhatsApp de supervisión">${ic('sms')}</button></div>${j.alertas.filter(a => a.estado == 'abierta').map(a => `<div class="sm al">${ic('warning')} ${esc(a.texto)} <button data-a="alres" data-id="${j.id}" data-i="${a.id}" style="border:0;padding:0" title="Resolver">${ic('done')}</button></div>`).join('')}</div></div>
         ${S.log ? `<h3>Bitácora</h3><div class="nt" style="max-height:140px">${[...j.eventos].reverse().map(e => `<p>${hm(e.fechaISO)} · <b>${e.tipo}</b> ${esc(e.detalle)} <small>${esc(e.autor)}</small></p>`).join('')}</div>` : ''}
         </div><div class="ft"><button data-a="help" title="Ayuda">${ic('help')}</button><button data-a="log" title="Bitácora">${ic('history')}</button><button data-a="del" data-id="${j.id}" title="Eliminar">${ic('delete')}</button>
         ${j.estado == 'completado' ? `<button data-a="reab" data-id="${j.id}" title="Reabrir">${ic('replay')}</button>` : j.estado == 'proceso' ? `<button data-a="pau" data-id="${j.id}" title="Pausar">${ic('pause')}</button>` : `<button data-a="ini" data-id="${j.id}" title="${j.estado == 'pausa' ? 'Reanudar' : 'Iniciar'}">${ic(j.estado == 'pausa' ? 'replay' : 'play_arrow')}</button>`}
         ${j.estado != 'completado' ? `<button data-a="com" data-id="${j.id}" class="${rdy(j) ? 'rdy' : ''}" title="Completar">${ic('check')}</button>` : '<span></span>'}<button data-a="edit" data-id="${j.id}" title="Editar esta orden">${ic('edit')}</button></div></div>`
    };
    const card = (j, x) => {
        const o = S.open == j.id;
        return `<div class="item ${j.estado == 'cola' ? 'sub' : ''} ${typeof x == 'string' ? x : ''} ${o ? 'op' : ''}" data-pl="${j.plataformaId}">${j.estado == 'cola' ? ic('subdirectory_arrow_right', 'arr') : ''}<div class="card ${o ? 'open' : ''}">${o ? detail(j) : row(j) + doneLine(j) + reaBox(j)}</div>${o ? '' : side(j)}</div>`
    };
    const doneLine = j => j.estado == 'completado' ? `<div class="sm">Real ${Math.round(j.tiempos.realSeg / 60)} min · Estimado ${Math.round(j.tiempos.estSeg / 60)} min · ${j.tiempos.desvSeg > 0 ? '+' : ''}${Math.round(j.tiempos.desvSeg / 60)} min</div>` : '';
    const rank = {
        proceso: 0,
        pausa: 1,
        cola: 2
    };
    function lista() {
        // lo que cambia al buscar o filtrar (texto, estado y zona)
        const zid = S.view == 'zona' ? S.zid : S.zf,
            flt = !!S.q.trim() || !!S.f,
            Z = j => !zid || zof(j) == zid,
            A = S.jobs.filter(j => j.estado != 'completado' && match(j) && Z(j) && (!S.f || S.f == j.estado)),
            C = S.jobs.filter(j => j.estado == 'completado' && hoy(j.tiempos.completadoISO) && match(j) && Z(j) && (!S.f || S.f == 'completado')),
            cdb = p => {
                const cd = C.filter(j => j.plataformaId == p.id).sort((a, b) => b.tiempos.completadoISO.localeCompare(a.tiempos.completadoISO));
                if (!cd.length)
                    return '';
                const n = flt ? 99 : (S.cd[p.id] || 0),
                    vis = cd.filter((j, i) => i < n || j.id == S.open);
                return `<button class="cdh" data-a="cd" data-id="${p.id}">${ic(n ? 'expand_less' : 'expand_more')} Completadas hoy · ${cd.length}</button>${vis.map(j => card(j, 'cdi')).join('')}${n && !flt && cd.length > n ? `<button class="cdh" data-a="go" data-v="comp"${zid ? ` data-z="${zid}"` : ''}>${ic('list_alt')} Ver todas en Órdenes completas</button>` : ''}`
            };
        if (!S.cfg.plataformas.some(p => p.activo))
            return `<div class="empty">Aún no hay zonas ni sub-zonas.<br><button data-a="go" data-v="cfg" style="margin-top:8px">${ic('settings')} Crear en Configuración</button></div>`;
        const P = S.cfg.plataformas.filter(p => p.activo && (!zid || p.zonaId == zid)),
            sec = p => {
                const L = A.filter(j => j.plataformaId == p.id).sort((a, b) => rank[a.estado] - rank[b.estado] || (b.prioridad == 'urgente') - (a.prioridad == 'urgente') || a.tiempos.ingresoISO.localeCompare(b.tiempos.ingresoISO)),
                    hc = C.some(j => j.plataformaId == p.id);
                if (flt && !L.length && !hc)
                    return '';
                return `<h2>${esc(p.nombre)}</h2>${L.map(j => card(j)).join('') || (hc ? '' : '<div class="mut">Sin trabajos</div>')}${cdb(p)}`
            },
            grp = S.view == 'linea' && !zid && S.cfg.zonas.length > 1,

                const h = P.filter(p => p.zonaId == z.id).map(sec).join('');
                return h ? `<div class="zh">${ic('location_on')}${esc(z.nombre)}<small>${zjobs(z.id).length} ${zjobs(z.id).length == 1 ? 'activo' : 'activos'}</small></div>${h}` : ''

    }
    const srch = () => `<div class="srch">${ic('search')}<input id="q" type="text" enterkeyhint="search" autocomplete="off" placeholder="Buscar patente, OT o cliente" value="${esc(S.q)}"><button data-a="qclr" title="Limpiar">${ic('close')}</button></div>`;
    function linea() {
        const Z = j => !S.zf || zof(j) == S.zf,
            A = S.jobs.filter(j => j.estado != 'completado' && Z(j)),
            C = S.jobs.filter(j => j.estado == 'completado' && hoy(j.tiempos.completadoISO) && Z(j)),
            n = e => e == 'completado' ? C.length : A.filter(j => j.estado == e).length;
        return `<div class="top"><button data-a="go" data-v="home" title="Inicio">${ic('first_page')}</button><h1>Línea de trabajo</h1></div>

    }
    /* v0.18 · filtros de fecha de Órdenes completas: Hoy / Ayer / Semana pasada (lunes a domingo anteriores) / Fechas… (un día o rango) */
    const addD = (d, n) => {
        const x = new Date(d);
        x.setDate(x.getDate() + n);
        return x
    };
    function dfRange() {
        const k = S.df.k;
        if (!k)
            return null;
        const t = new Date();
        t.setHours(0, 0, 0, 0);
        if (k == 'hoy')
            return [t, addD(t, 1)];
        if (k == 'ayer')
            return [addD(t, -1), t];
        if (k == 'sem') {
            const mon = addD(t, -((t.getDay() + 6) % 7));
            return [addD(mon, -7), mon]
        }
        if (k == 'rango') {
            const a = S.df.d1 || S.df.d2,
                b = S.df.d2 || S.df.d1;
            if (!a)
                return null;
            const pd = v => {
                const [y, m, d] = v.split('-');
                return new Date(+y, m - 1, +d)
            };
            let x = pd(a),
                y = pd(b);
            if (y < x)
                [x, y] = [y, x];
            return [x, addD(y, 1)]
        }
        return null
    }
    const dfOK = j => {
        const r = dfRange();
        if (!r)
            return true;
        const t = Date.parse(j.tiempos.completadoISO);
        return t >= r[0] && t < r[1]
    };
    const dfInfo = L => {
        const r = dfRange();
        if (!r)
            return '';
        const f = d => d.toLocaleDateString('es-CL', {
                day: '2-digit',
                month: '2-digit'
            }),
            e = addD(r[1], -1),
            lb = +r[0] == +e ? f(r[0]) : f(r[0]) + ' al ' + f(e);
        return `<div class="sm dfl">${lb} · ${L.length} ${L.length == 1 ? 'orden' : 'órdenes'}</div>`
    };
    const dfBar = () => {
        const k = S.df.k || '';
        return `<div class="zf dff" role="group" aria-label="Filtrar por fecha"><span class="sm">Fecha</span>${[['', 'Todas'], ['hoy', 'Hoy'], ['ayer', 'Ayer'], ['sem', 'Semana pasada'], ['rango', 'Fechas…']].map(([x, t]) => `<button class="zc ${k == x ? 'sel' : ''}" data-a="dfk" data-k="${x}">${x == 'rango' ? ic('calendar_month') : ''}${t}</button>`).join('')}</div>${k == 'rango' ? `<div class="dfr"><label>Desde<input type="date" data-ch="df1" value="${esc(S.df.d1)}"></label><label>Hasta<input type="date" data-ch="df2" value="${esc(S.df.d2)}"></label></div>` : ''}`
    };
    function listaC() {
        const L = S.jobs.filter(j => j.estado == 'completado' && match(j) && (!S.zf || zof(j) == S.zf) && (!S.pf || j.plataformaId == S.pf) && dfOK(j)).sort((a, b) => b.tiempos.completadoISO.localeCompare(a.tiempos.completadoISO)),
            it = j => `<div class="item"><div class="card ${S.open == j.id ? 'open' : ''}">${S.open == j.id ? detail(j) : row(j) + doneLine(j) + reaBox(j) + zl(j)}</div></div>`;
        if (S.zg && !S.zf && S.cfg.zonas.length > 1) {
            const o = S.cfg.zonas.map(z => {
                const g = L.filter(j => zof(j) == z.id);
                return g.length ? `<div class="zh">${ic('location_on')}${esc(z.nombre)}<small>${g.length} completadas</small></div>${g.map(it).join('')}` : ''
            }).join('');
            if (o)
                return dfInfo(L) + o
        }
        return dfInfo(L) + (L.map(it).join('') || `<div class="empty">${S.q.trim() || S.zf || S.pf || S.df.k ? 'Sin resultados.' : 'Aún no hay órdenes completadas.'}</div>`)
    }
    function completas() {
        return `<div class="top"><button data-a="go" data-v="home">${ic('first_page')}</button><h1>Órdenes completas</h1></div>${srch()}${dfBar()}${zfil()}<div id="lst">${listaC()}</div>`
    }

    function fixWin() {
        // v0.25: cada ventana = cabecera fija + cuerpo con scroll + botones fijos
        document.querySelectorAll('#modal .box:not(.c):not(.fx)').forEach(b => {
            const c = [...b.children];

            const h = [c.shift()];
            if (h[0].tagName == 'B' && c[0]?.classList.contains('sm'))

            const l = c[c.length - 1],
                f = l && l.matches('.ft,.btns') ? c.pop() : null,
                H = document.createElement('div'),
                B = document.createElement('div');
            H.className = 'bh';
            H.append(...h);
            B.className = 'bb';
            B.append(...c);
            b.classList.add('fx');
            b.append(H, B);
            if (f) {
                f.classList.add('bf');
                b.append(f)
            }
        })
    }

    async function orderImage(j) {
        try {
            await document.fonts?.ready
        } catch (e) {}
        const W = 1080,
            P = 48,
            F = 'Inter, Arial, sans-serif',
            COL = {
                cola: '#f5c000',
                proceso: '#f26a21',
                pausa: '#e11d1d',
                completado: '#2eb34a'
            };
        const rr = (c, x, y, w, h, r, fill, stroke, lw=3, dash) => {
            c.beginPath();
            c.moveTo(x + r, y);
            c.arcTo(x + w, y, x + w, y + h, r);
            c.arcTo(x + w, y + h, x, y + h, r);
            c.arcTo(x, y + h, x, y, r);
            c.arcTo(x, y, x + w, y, r);
            c.closePath();
            if (fill) {
                c.fillStyle = fill;
                c.fill()
            }
            if (stroke) {
                c.lineWidth = lw;
                c.strokeStyle = stroke;
                c.setLineDash(dash || []);
                c.stroke();
                c.setLineDash([])
            }
        };
        const T = (c, t, x, y, font, col, al='left', ls='0px') => {
            c.font = font + ' ' + F;
            c.fillStyle = col;
            c.textAlign = al;
            if ('letterSpacing' in c)
                c.letterSpacing = ls;
            c.fillText(t, x, y);
            if ('letterSpacing' in c)
                c.letterSpacing = '0px'
        };
        const wrap = (c, t, x, y, mw, lh, font, col) => {
            c.font = font + ' ' + F;
            c.fillStyle = col;
            c.textAlign = 'left';
            let l = '';
            for (const w of String(t).split(/\s+/)) {
                const n = l ? l + ' ' + w : w;
                if (c.measureText(n).width > mw && l) {
                    c.fillText(l, x, y);
                    y += lh;
                    l = w
                } else
                    l = n
            }
            if (l) {
                c.fillText(l, x, y);
                y += lh
            }
            return y
        };
        const chips = (c, L, x, y, mw, col) => {
            if (!L.length) {
                T(c, '—', x, y + 38, '400 28px', '#999');
                return y + 70
            }
            let cx = x;
            for (const it of L) {
                c.font = '500 28px ' + F;
                const w = c.measureText(it.t).width + 44;
                if (cx + w > x + mw && cx > x) {
                    cx = x;
                    y += 70
                }
                rr(c, cx, y, w, 56, 28, it.d ? '#2eb34a' : '#fff', it.d ? '#2eb34a' : col, 3);
                T(c, it.t, cx + 22, y + 38, '500 28px', it.d ? '#fff' : '#111');
                cx += w + 14
            }
            return y + 70
        };
        const draw = c => {
            const X = P + 40,
                IW = W - 2 * X,
                v = j.vehiculo,
                t = j.tiempos,
                o = j.opciones || {},
                [tx, cl] = estado(j),
                pat = v.patente || '—';
            const ln = y => {
                c.beginPath();
                c.moveTo(X, y);
                c.lineTo(X + IW, y);
                c.strokeStyle = '#ddd';
                c.lineWidth = 2;
                c.setLineDash([]);
                c.stroke()
            };
            const hd = (txt, y) => {
                T(c, txt, X, y, '700 24px', '#777', 'left', '3px')
            };
            c.fillStyle = '#fff';
            c.fillRect(0, 0, W, 6000);
            T(c, 'Solicitud de revisión', P, 84, '700 46px', '#e11d1d');
            T(c, S.cfg.negocio || 'Lubricentro', P, 126, '400 28px', '#6b6b6b');
            T(c, new Date().toLocaleString('es-CL', {
                dateStyle: 'short',
                timeStyle: 'short'

    function editSave(pat) {
        // guarda los cambios de una orden existente (no crea una nueva, no toca estado ni cronómetro)
        const j = get(D._edit);
        if (!j) {
            S.modal = null;
            return render(1)
        }
        if (j.estado == 'proceso' && D.plat != j.plataformaId && S.jobs.some(x => x.plataformaId == D.plat && x.estado == 'proceso' && x.id != j.id))
            return toast('warning', 'Ya hay un trabajo en proceso en esa sub-zona');
        const cat = S.cfg.catalogo,
            v = j.vehiculo,
            o = j.opciones || {},
            ch = [],
            pe = personas().find(q => q.id == D.ing);
        const sv = D.svc.map(c => {
            const e = j.servicios.find(x => x.cod == c);
            if (e)
                return e;
            const x = cat.find(y => y.cod == c);
            return x && {
                    cod: x.cod,
                    nombre: x.nombre,
                    grupo: x.grupo,
                    cat: x.cat,
                    estSeg: x.min * 60,
                    hecho: false
                }
        }).filter(Boolean)
        .concat(D.custom.map(n => j.servicios.find(x => x.cod == 'OTRO' && x.nombre == n) || {
            cod: 'OTRO',
            nombre: n,
            grupo: 'Otros',
            cat: 'cambiar',
            estSeg: 1800,
            hecho: false
        }));
        const nw = {
            patente: (D.patente || '').toUpperCase(),
            marca: D.marca || '',
            modelo: D.modelo || '',
            version: D.version || '',
            motor: D.motor || '',
            combustible: D.comb || '',
            km: +D.km || 0
        };
        for (const k in nw)
            if (v[k] != nw[k])
                ch.push(k);
        const ot = (D.ot || '').trim();
        if ((j.ot || '') != ot)
            ch.push('OT');
        if ((j.cliente.nombre || '') != (D.nombre || '') || (j.cliente.telefono || '') != (D.tel || ''))
            ch.push('cliente');
        if (j.plataformaId != D.plat)
            ch.push('plataforma');
        if ((j.mecanicoId || '') != (D.mec || ''))
            ch.push('mecánico');
        if (pe && pe.id != j.ingresadoPor?.id)
            ch.push('ingresada por');
        if (j.prioridad != (D.prio || 'normal'))
            ch.push('prioridad');
        const a1 = a => a.map(x => x.cod + x.nombre).sort().join('|'),
            a2 = a => a.map(r => r.grupo + r.nombre + r.cant).sort().join('|');
        if (a1(sv) != a1(j.servicios))
            ch.push('servicios');
        if (a2(D.rep) != a2(j.repuestos))
            ch.push('repuestos');
        Object.assign(v, nw);
        v.patenteN = pat;
        j.ot = ot;
        j.cliente = {
            nombre: D.nombre || '',
            telefono: D.tel || ''
        };
        j.plataformaId = D.plat;
        j.mecanicoId = D.mec || '';
        if (pe)
            j.ingresadoPor = {
                id: pe.id,
                nombre: pe.nombre
            };
        j.prioridad = D.prio || 'normal';
        j.servicios = sv;
        j.repuestos = D.rep;
        j.opciones = {
            espera: !!D.espera,
            entregaISO: D.entrega && D.entrega == hhmm(o.entregaISO) ? o.entregaISO : hhISO(D.entrega),
            vin: (D.vin || '').trim().toUpperCase(),
            nivelComb: D.nivel || ''
        };
        const ne = +D.estMin > 0 ? Math.round(+D.estMin * 60) : sv.reduce((a, x) => a + x.estSeg, 0);
        if (Math.abs(ne - j.tiempos.estSeg) >= 60)
            ch.push('tiempo estimado');
        j.tiempos.estSeg = ne;
        if (D.ingreso && D.ingreso !== hhmm(j.tiempos.ingresoISO)) {
            const d = new Date(j.tiempos.ingresoISO),
                [h, m] = D.ingreso.split(':');
            d.setHours(+h, +m, 0, 0);
            j.tiempos.ingresoISO = d.toISOString();
            ch.push('ingreso')
        }
        const nn = (tp, x) => {
            if (x && x.trim()) {
                j.notas.push({
                    id: uid(),
                    tipo: tp,
                    texto: x.trim(),
                    autor: autor(),
                    fechaISO: now()
                });
                ch.push('nota')
            }
        };
        nn('orden', D.notaO);
        nn('vehiculo', D.notaV);
        if (j.estado == 'completado')
            j.tiempos.desvSeg = j.tiempos.realSeg - j.tiempos.estSeg;
        if (ch.length)
            ev(j, 'editado', ch.join(', '));
        const h = S.view == 'home' && S.open == j.id;
        D = null;
        S.modal = null;
        mark('flash', j.id, 1300);
        saveJob(j);
        if (h)
            dashOut(j.id, 1);
        toast('check', 'Orden actualizada')
    }

    function autofill(n) {

        D._ap = n;
        const o = S.jobs.filter(j => j.vehiculo.patenteN == n).sort((a, b) => b.tiempos.ingresoISO.localeCompare(a.tiempos.ingresoISO))[0];
        if (!o)
            return;
        const v = o.vehiculo;
        for (const [k, x] of Object.entries({
            nombre: o.cliente.nombre,
            tel: o.cliente.telefono,
            marca: v.marca,
            modelo: v.modelo,
            version: v.version,
            motor: v.motor,
            comb: v.combustible
        }))
            if (!D[k] && x)
                D[k] = x;
        D._known = 'Vehículo conocido · última visita ' + new Date(o.tiempos.ingresoISO).toLocaleDateString('es-CL') + (v.km ? ' · km anterior ' + (+v.km).toLocaleString('es-CL') : '');

    }

        paused: false,
        iv: null,
        DUR: 7000,
        SNZ: 5
    }; // SNZ = minutos de posposición
    function alPush(j, cl) {
        const a = {
            id: j.id,
            cl,
            m: cl == 'atraso' ? Math.max(0, Math.ceil((el(j) - j.tiempos.estSeg) / 60)) : Math.max(1, Math.ceil((j.tiempos.estSeg - el(j)) / 60)),
            d: (j.ot ? 'OT ' + j.ot + ' · ' : '') + j.vehiculo.patente
        };
        AL.q = AL.q.filter(x => x.id !== a.id);
        AL.q.push(a);
        if (!AL.cur)
            alNext();
        else if (AL.cur.id === a.id) {
            AL.q.unshift(AL.q.pop());
            alHide()
        }
    }
    function alNext() {
        clearInterval(AL.iv);
        const a = AL.cur = AL.q.shift(),
            box = document.getElementById('alb');
        if (!a) {
            box.innerHTML = '';
            return
        }
        box.innerHTML = `<div class="alb ${a.cl}" role="alert"><i class="dot ${a.cl == 'atraso' ? 'pausa' : 'cola'}"></i><span class="tx"><b>${a.cl == 'atraso' ? 'Atrasada' + (a.m ? ' · +' + a.m + ' min' : '') : 'Por vencer · quedan ' + a.m + ' min'}</b><span>${esc(a.d)}</span></span><button data-al="p" title="Volver a avisar en ${AL.SNZ} min">Posponer</button><span class="cd"><b id="alc">${AL.DUR / 1000}</b>s</span><button class="xx" data-al="x" title="Cerrar" aria-label="Cerrar">${ic('close')}</button><div class="pb" id="alp"></div></div>`;
        AL.left = AL.DUR;
        AL.last = Date.now();
        AL.paused = false;
        navigator.vibrate?.(40);
        AL.iv = setInterval(() => {
            const t = Date.now(),
                dt = t - AL.last;
            AL.last = t;
            if (!AL.paused)
                AL.left -= dt;
            const c = document.getElementById('alc'),
                p = document.getElementById('alp');
            if (c)
                c.textContent = Math.max(0, Math.ceil(AL.left / 1000));
            if (p)
                p.style.transform = `scaleX(${Math.max(0, AL.left / AL.DUR)})`;
            if (AL.left <= 0)
                alHide()
        }, 100)
    }
    function alHide() {
        clearInterval(AL.iv);
        const e = document.querySelector('#alb .alb');
        if (!e) {
            alNext();
            return
        }
        if (e.classList.contains('out'))
            return;
        e.classList.add('out');
        setTimeout(alNext, 220)
    }
    document.getElementById('alb').addEventListener('click', e => {
        const b = e.target.closest('[data-al]');
        if (!b || !AL.cur)
            return;
        if (b.dataset.al == 'p') {
            (R.snz = R.snz || {})[AL.cur.id] = Date.now() + AL.SNZ * 60000
        }
        alHide()
    });
    document.getElementById('alb').addEventListener('pointerenter', () => AL.paused = true); // con el dedo o el mouse encima, la cuenta se detiene
    document.getElementById('alb').addEventListener('pointerleave', () => {
        AL.paused = false;
        AL.last = Date.now()
    });
    function watch() {
        // avisa UNA vez cuando un trabajo en proceso pasa a "por vencer" o "atrasada"; el banner no interrumpe, así que sale incluso con una ventana abierta
        if (S.cfg.alertas === false || !S.jobs.length)
            return;
        const first = !R.wa;
        R.wa = R.wa || {};
        for (const j of S.jobs) {
            if (j.estado != 'proceso') {
                delete R.wa[j.id];
                if (R.snz)
                    delete R.snz[j.id];
                continue
            }
            const cl = estado(j)[1];
            if (R.wa[j.id] === cl)
                continue;
            R.wa[j.id] = cl;
            if (!first && (cl == 'vencer' || cl == 'atraso') && !(R.snz && R.snz[j.id]))
                alPush(j, cl)
        }
        if (R.snz)
            for (const id in R.snz) {
                if (Date.now() < R.snz[id])
                    continue;
                delete R.snz[id];
                const j = get(id);
                if (j && j.estado == 'proceso') {
                    const cl = estado(j)[1];
                    if (cl == 'vencer' || cl == 'atraso')
                        alPush(j, cl)
                }
            }
        if (S.modal || S.help || document.activeElement?.matches('input,textarea,select'))
            return; // redibujar solo si no se está escribiendo
        const f = !R.w;
        R.w = R.w || {};
        let ch = 0;
        for (const j of S.jobs) {
            if (j.estado != 'proceso') {
                delete R.w[j.id];
                continue
            }
            const cl = estado(j)[1];
            if (R.w[j.id] === cl)
                continue;
            R.w[j.id] = cl;
            ch = 1
        }
        if (ch && !f)
            render()
    }
    setInterval(() => {
        if (document.hidden)
            return;
        document.querySelectorAll('[data-c]').forEach(n => {
            const j = get(n.dataset.c);
            if (j) {
                n.textContent = clock(el(j));
                const a = estado(j)[1] == 'atraso';
                n.classList.toggle('atraso', a);
                n.classList.toggle('run', a && j.estado == 'proceso')
            }
        });
        document.querySelectorAll('[data-w]').forEach(n => n.textContent = wait(n.dataset.w));
        document.querySelectorAll('[data-greet]').forEach(n => {
            const g = greet();
            if (n.dataset.g !== g) {
                n.dataset.g = g;
                n.innerHTML = greetH()
            }
        });
        document.querySelectorAll('[data-date]').forEach(n => n.textContent = dDate());
        document.querySelectorAll('[data-time]').forEach(n => n.textContent = dTime());
        watch()
    }, 1000); // cronómetro, tiempos de espera y avisos en vivo
    const ANIM_ON = () => {
        try {
            return localStorage.lub_anim !== 'sys'
        } catch (e) {
            return true
        }
    }; // por defecto las animaciones SIEMPRE se muestran
    const _stEl = document.querySelector('style'),
        _css0 = _stEl.textContent;
    function applyAnim() {
        _stEl.textContent = ANIM_ON() ? _css0.replace(/@media\s*\(prefers-reduced-motion:\s*no-preference\)/g, '@media all').replace(/@media\s*\(prefers-reduced-motion:\s*reduce\)/g, '@media not all') : _css0
    }
    applyAnim();
    /* v0.17 · fechas: ingT = hora si es de hoy, o "dd/mm hh:mm" si es otro día (órdenes programadas); dtLocal = valor para <input type=datetime-local> */
    const ingT = iso => hoy(iso) ? hm(iso) : new Date(iso).toLocaleDateString('es-CL', {
            day: '2-digit',
            month: '2-digit'
        }) + ' ' + hm(iso),
        dtLocal = ms => new Date(ms - new Date(ms).getTimezoneOffset() * 6e4).toISOString().slice(0, 16);

    /* ---- v0.25 · medidas de pantalla (barra, teclado) y buscador flotante del Mapa ---- */
    function vvSync() {
        const v = window.visualViewport,
            h = v ? v.height : innerHeight,
            t = v ? v.offsetTop : 0,
            nb = $('#nav'),
            nh = nb ? nb.offsetHeight : 78,
            kb = innerHeight - h - t > 140,
            r = document.documentElement.style;
        r.setProperty('--vvh', h + 'px');
        r.setProperty('--vvt', t + 'px');
        if (nh)
            r.setProperty('--nh', nh + 'px');
        r.setProperty('--avh', Math.max(120, h - (kb ? 0 : nh)) + 'px')
    }
    {
        let q = 0;
        const s = () => {
            if (q)
                return;
            q = requestAnimationFrame(() => {
                q = 0;
                vvSync()
            })
        };
        addEventListener('resize', s);
        addEventListener('orientationchange', s);
        visualViewport?.addEventListener('resize', s);
        visualViewport?.addEventListener('scroll', s);
        if (window.ResizeObserver)
            new ResizeObserver(s).observe($('#nav'));
        vvSync()
    }
    function msf(on) {
        const t = $('#mtop'),
            s = $('#mslot');
        if (!t || !s)
            return;
        if (on) {
            clearTimeout(R.mft);
            if (!t.classList.contains('msf')) {
                s.style.height = t.offsetHeight + 'px';
                t.classList.add('msf');
                S.mfl = 1;
                mMap()
            }
        }
        else if (t.classList.contains('msf')) {
            t.classList.remove('msf');
            s.style.height = '';
            S.mfl = 0;
            mMap();
            $('#app').scrollTop = 0
        }
    }
    document.addEventListener('focusin', e => {
        if (e.target.id == 'mq')
            msf(1)
    });
    document.addEventListener('focusout', e => {
        if (e.target.id == 'mq') {
            clearTimeout(R.mft);
            R.mft = setTimeout(() => {
                if (document.activeElement?.id != 'mq')
                    msf(0)
            }, 220)
        }
    });
    document.addEventListener('pointerdown', e => {
        if (document.activeElement?.id == 'mq' && e.target.closest('#mtop') && !e.target.closest('input'))
            e.preventDefault()
    }); // tocar resultados no cierra el teclado
    await initDB();
    render(1);
    </script>
</body>
